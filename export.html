<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>実績CSV出力 | CP My Page</title>

    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon.png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --copros-blue: #87ceeb; --copros-orange: #ff7e11; --copros-navy: #004098; }
        body { font-family: "Hiragino Kaku Gothic ProN", Meiryo, sans-serif; background-color: #f1f5f9; }
        
        /* 統一されたカードデザイン */
        .section-card { background: white; border-radius: 1.5rem; border: 1px solid #e2e8f0; box-shadow: 0 10px 25px rgba(0,0,0,0.04); padding: 2rem; margin-bottom: 1.5rem; }
        
        /* 最新ページ共通の見出しスタイル */
        .section-title { font-size: 0.75rem; font-weight: 900; color: #94a3b8; letter-spacing: 0.1em; border-bottom: 2px solid #f1f5f9; padding-bottom: 0.5rem; margin-bottom: 1.5rem; text-transform: uppercase; }
        
        /* フォーム入力の親切設計 */
        .form-input { width: 100%; padding: 0.75rem 1rem; background-color: #f8fafc; border: 1px solid #e2e8f0; border-radius: 0.75rem; font-weight: 800; font-size: 0.9rem; outline: none; transition: all 0.2s; color: #334155; }
        .form-input:focus { border-color: var(--copros-orange); background-color: white; box-shadow: 0 0 0 4px rgba(255, 126, 17, 0.05); }
        
        /* チェックボックスのスタイリッシュ演出 */
        .checkbox-card { cursor: pointer; display: flex; align-items: center; gap: 0.75rem; padding: 0.75rem 1rem; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 1rem; transition: all 0.2s; }
        .checkbox-card:hover { transform: translateY(-2px); border-color: var(--copros-blue); }
        .checkbox-card.active { background: #eff6ff; border-color: var(--copros-navy); color: var(--copros-navy); box-shadow: 0 4px 12px rgba(0,64,152,0.1); }
        .checkbox-card input { width: 1.1rem; height: 1.1rem; accent-color: var(--copros-navy); }
        
        /* クイックボタン */
        .quick-btn { padding: 0.5rem 1rem; border-radius: 0.75rem; font-size: 0.7rem; font-weight: 900; background: white; border: 1px solid #e2e8f0; color: #64748b; transition: all 0.2s; }
        .quick-btn:hover { background: var(--copros-navy); color: white; border-color: var(--copros-navy); }
        
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
  /* 🔍 お客様名検索の候補リスト用デザイン */
.suggestion-box {
    position: absolute;
    width: 100%;
    top: 100%;
    left: 0;
    z-index: 999; /* 確実に一番上に表示させる */
    background: white;
    border-radius: 0.75rem;
    box-shadow: 0 10px 25px rgba(0,0,0,0.15);
    border: 1px solid #e2e8f0;
    max-height: 250px;
    overflow-y: auto;
    display: none; /* 初期状態は非表示 */
}

.suggestion-item {
    padding: 0.8rem 1.2rem;
    cursor: pointer;
    font-weight: 600;
    font-size: 0.85rem;
    border-bottom: 1px solid #f8fafc;
    transition: all 0.2s;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.suggestion-item:last-child {
    border-bottom: none;
}

.suggestion-item:hover {
    background-color: #f1f5f9;
    color: var(--copros-orange);
}

/* 検索ボックスを囲む relative クラスを維持するため */
.relative { position: relative; }      
    </style>
</head>
<body class="flex h-screen overflow-hidden text-slate-700">
    <div id="sidebar-placeholder"></div>
    <main class="flex-1 flex flex-col overflow-hidden">
        <div id="header-placeholder"></div>
        <div class="flex-1 overflow-y-auto p-4 lg:p-8 custom-scrollbar">
            <div class="max-w-4xl mx-auto">
                <div class="flex flex-col lg:flex-row justify-between items-start lg:items-end mb-10 gap-4">
                    <div>
                        <h1 class="text-3xl lg:text-4xl font-black text-slate-800 tracking-tighter mb-2">実績CSV出力</h1>
                        <nav class="text-[10px] font-black text-slate-400 uppercase tracking-widest italic italic mb-4">Activity Data Export Center</nav>
                        <p class="text-sm font-bold text-slate-500 border-l-4 border-orange-500 pl-4">必要な条件を指定して、実績データを一括ダウンロードします。</p>
                    </div>
                    <button onclick="history.back()" class="px-6 py-2.5 bg-white border border-slate-200 text-slate-500 rounded-xl font-bold text-xs hover:bg-slate-50 shadow-sm transition-all">戻る</button>
                </div>

                <!-- 1. 抽出条件 -->
                <div class="section-card">
                    <p class="section-title">Step 01. 抽出範囲を指定</p>
                    <div class="space-y-6">
                        <div>
                            <div class="flex justify-between items-center mb-3">
                                <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest">対象期間（訪問日）</label>
                                <div class="flex gap-2">
                                    <button onclick="window.setQuickPeriod('thisMonth')" class="quick-btn">今月</button>
                                    <button onclick="window.setQuickPeriod('lastMonth')" class="quick-btn">先月</button>
                                </div>
                            </div>
                            <div class="flex flex-col sm:flex-row items-center gap-3">
                                <input type="date" id="dateStart" class="form-input" onchange="window.updateCount()">
                                <span class="font-black text-slate-300">〜</span>
                                <input type="date" id="dateEnd" class="form-input" onchange="window.updateCount()">
                            </div>
                        </div>
<div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-6">
    <div>
        <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-3 block">部署</label>
        <select id="deptFilter" class="form-input" onchange="window.updateCount()">
            <option value="ALL">全部署分を出力</option>
            <option>ケコム部</option>
            <option>関西支店</option>
            <option>関東支店</option>
            <option>中部営業所</option>
            <option value="OTHER">その他の部署</option>
        </select>
    </div>
    <div>
        <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-3 block">訪問者</label>
        <select id="visitorFilter" class="form-input" onchange="window.updateCount()">
            <option value="ALL">全員分を出力</option>
        </select>
    </div>
    <div>
        <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-3 block">顧客ランク</label>
        <select id="rankFilter" class="form-input" onchange="window.updateCount()">
            <option value="ALL">すべてのランク</option>
            <option>Aa</option><option>Ab</option><option>Ac</option><option>Ad</option>
            <option>Ba</option><option>Bb</option><option>Bc</option><option>Bd</option>
            <option>Ca</option><option>Cb</option><option>Cc</option><option>Cd</option>
            <option>取引先</option><option>合併</option><option>廃業</option>
        </select>
    </div>
</div>

<!-- 🌟 追加：2段目にお客様名検索と属性区分を配置 -->
<div class="grid grid-cols-1 md:grid-cols-3 gap-6">
    <div>
        <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-3 block">属性区分</label>
        <select id="attrFilter" class="form-input" onchange="window.updateCount()">
            <option value="ALL">読み込み中...</option>
        </select>
    </div>
    <div class="md:col-span-2">
        <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-3 block">お客様名（企業名）で絞り込み</label>
        <div class="relative">
            <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-slate-300"></i>
            <input type="text" id="customerSearch" class="form-input pl-11" placeholder="キーワードを入力..." autocomplete="off">
            <div id="customerSuggestions" class="suggestion-box"></div>
        </div>
    </div>
</div>
                <!-- 2. 出力項目 -->
                <div class="section-card">
                    <div class="flex justify-between items-center mb-6">
                        <p class="section-title mb-0 border-0">Step 02. 出力項目を選択</p>
                        <div class="flex gap-3">
                            <button onclick="window.toggleAllChecks(true)" class="text-[10px] font-black text-blue-500 hover:underline">すべて選択</button>
                            <button onclick="window.toggleAllChecks(false)" class="text-[10px] font-black text-slate-400 hover:underline">解除</button>
                        </div>
                    </div>
                    <div id="columnGrid" class="grid grid-cols-2 md:grid-cols-3 gap-3">
                        <!-- JSで生成 -->
                    </div>
                </div>

                <!-- 3. 実行エリア -->
                <div class="flex flex-col items-center py-12 gap-6">
                    <div class="flex items-center gap-4 px-6 py-3 bg-slate-100 rounded-full border border-slate-200">
                        <span class="text-[11px] font-black text-slate-400 uppercase tracking-widest">対象データ件数</span>
                        <span id="matchCount" class="text-xl font-black text-[#004098]">0</span>
                        <span class="text-xs font-bold text-slate-500">件</span>
                    </div>
                    
                    <button id="exportBtn" onclick="window.executeExport()" class="w-full max-w-sm py-5 bg-[#004098] text-white rounded-2xl font-black text-lg hover:shadow-2xl hover:-translate-y-1 active:scale-95 transition-all flex items-center justify-center gap-4 disabled:opacity-30 disabled:translate-y-0 disabled:cursor-not-allowed shadow-lg">
                        <i class="fa-solid fa-cloud-arrow-down text-2xl"></i>
                        <span>CSVファイルをダウンロード</span>
                    </button>
                    
                    <div class="flex items-center gap-2 text-[10px] font-black text-slate-400 italic">
                        <i class="fa-solid fa-circle-info"></i>
                        <span>Excelで開いても文字化けしない形式(BOM付き)で出力されます</span>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script type="module" src="common.js"></script>
    <script type="module">
        import { db } from "./common.js";
        import { collection, getDocs, query, where, orderBy, getCountFromServer, doc, getDoc, setDoc, serverTimestamp } 
        from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
       
        const COLUMNS = [
            { id: "visitDate", label: "訪問日", default: true },
            { id: "visitorDept", label: "所属部署", default: true },
            { id: "visitorName", label: "訪問者", default: true },
            { id: "customerName", label: "お客様名", default: true },
            { id: "customerRank", label: "ランク", default: true },
            { id: "customerAttr", label: "属性", default: true },
            { id: "customerStaffName", label: "先方担当者", default: true },
            { id: "companion", label: "同行者", default: true },
            { id: "startTime", label: "開始", default: false },
            { id: "endTime", label: "終了", default: false },
            { id: "qualData1", label: "定性1", default: false },
            { id: "qualData2", label: "定性2", default: false },
            { id: "qualData3", label: "定性3", default: false },
            { id: "qualFree", label: "定性自由", default: false },
            { id: "content", label: "報告内容", default: true },
            { id: "staffThoughts", label: "スタッフの考え", default: true },
            { id: "nextVisitDate", label: "次回予定", default: false }
        ];

        let updateTimer = null;
        let isExportLocked = false;

        function getUsageDocId() {
            const now = new Date();
            if (now.getHours() < 7) { now.setDate(now.getDate() - 1); }
            return now.toISOString().split('T')[0];
        }

        function setExportLock(locked, reason = "") {
            isExportLocked = locked;
            const btn = document.getElementById('exportBtn');
            const infoId = "lock-info-text";
            let infoEl = document.getElementById(infoId);
            if (locked) {
                btn.disabled = true;
                btn.style.backgroundColor = "#94a3b8";
                btn.innerHTML = `<i class="fa-solid fa-lock mr-2"></i> ${reason}`;
                if (!infoEl) {
                    infoEl = document.createElement('p');
                    infoEl.id = infoId;
                    infoEl.className = "text-[11px] font-black text-rose-500 mt-4 text-center leading-relaxed animate-pulse";
                    btn.parentNode.appendChild(infoEl);
                }
                infoEl.innerHTML = `🚫 本日の全社出力上限（1万件）に達しました。<br>システム保護のため、明日の朝7時まで停止します。`;
            } else {
                btn.disabled = false;
                btn.style.backgroundColor = "#004098";
                btn.innerHTML = `<i class="fa-solid fa-cloud-arrow-down text-2xl"></i><span>CSVファイルをダウンロード</span>`;
                if (infoEl) infoEl.remove();
            }
        }

        function buildBaseQuery() {
            const start = document.getElementById('dateStart').value.replace(/-/g, '/');
            const end = document.getElementById('dateEnd').value.replace(/-/g, '/');
            const dept = document.getElementById('deptFilter').value;
            const visitor = document.getElementById('visitorFilter').value;
            const rank = document.getElementById('rankFilter').value;
            const attr = document.getElementById('attrFilter').value;
            
            // 🌟 入力文字から不要な語句を削除して matchKey に合わせる
            let customer = document.getElementById('customerSearch').value.trim();
            customer = customer.replace(/株式会社|有限会社|（株）|$$株$$| |　/g, "");
            let q = query(collection(db, "activity_records"), 
                where("visitDate", ">=", start), 
                where("visitDate", "<=", end)
            );

            if (dept !== 'ALL' && dept !== 'OTHER') q = query(q, where("visitorDept", "==", dept));
            if (visitor !== 'ALL') q = query(q, where("visitorName", "==", visitor));
            if (rank !== 'ALL') q = query(q, where("customerRank", "==", rank));
            if (attr !== 'ALL') q = query(q, where("customerAttr", "==", attr));
            
            // 🌟 matchKey を使って 1 Read で前方一致検索
            if (customer) {
                q = query(q, 
                    where("matchKey", ">=", customer), 
                    where("matchKey", "<=", customer + "\uf8ff")
                );
            }

            return q;
        }

        window.updateCount = async () => {
            if (updateTimer) clearTimeout(updateTimer);
            updateTimer = setTimeout(async () => {
                const badge = document.getElementById('matchCount');
                try {
                    badge.innerText = "...";
                    const q = buildBaseQuery();
                    const snapCount = await getCountFromServer(q);
                    const count = snapCount.data().count;
                    badge.innerText = count.toLocaleString();
                    if (count === 0) {
                        document.getElementById('exportBtn').disabled = true;
                    } else if (!isExportLocked) {
                        document.getElementById('exportBtn').disabled = false;
                    }
                } catch (e) { console.error(e); badge.innerText = "Error"; }
            }, 700);
        };

        window.executeExport = async () => {
            if (isExportLocked) return;
            const btn = document.getElementById('exportBtn');
            const docId = getUsageDocId();
            const estimatedCount = parseInt(document.getElementById('matchCount').innerText.replace(/,/g, '')) || 0;
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i>上限確認中...';
            try {
                const limitRef = doc(db, "system_usage", docId);
                const usageSnap = await getDoc(limitRef);
                const currentTotal = usageSnap.exists() ? usageSnap.data().count : 0;
                if (currentTotal + estimatedCount > 10000) {
                    alert(`本日の上限を超えます。残枠: ${10000 - currentTotal}件`);
                    setExportLock(true, "本日は上限到達");
                    return;
                }
                btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i>データ取得中...';
                const snap = await getDocs(buildBaseQuery());
                let docs = snap.docs.map(d => d.data());
                const searchText = document.getElementById('customerSearch').value.trim();
                if (searchText) { docs = docs.filter(d => (d.customerName || "").includes(searchText)); }
                if (docs.length === 0) { alert("対象データがありません"); return; }
                btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i>件数記録中...';
                await setDoc(limitRef, { count: currentTotal + docs.length, date: docId, lastUpdate: serverTimestamp() }, { merge: true });
                const selectedCols = COLUMNS.filter(c => document.querySelector(`input[value="${c.id}"]`)?.checked);
                const csvRows = [selectedCols.map(c => `"${c.label}"`).join(",")];
                docs.forEach(data => {
                    const row = selectedCols.map(c => `"${(data[c.id] || "").toString().replace(/"/g, '""').replace(/\n/g, ' ')}"`);
                    csvRows.push(row.join(","));
                });
                const blob = new Blob(["\uFEFF" + csvRows.join("\n")], { type: 'text/csv;charset=utf-8;' });
                const link = document.createElement("a");
                link.href = URL.createObjectURL(blob);
                link.download = `実績データ_${docId}.csv`;
                link.click();
            } catch (e) { alert("エラー: " + e.message); }
            finally { if (!isExportLocked) { btn.disabled = false; btn.innerHTML = '<i class="fa-solid fa-cloud-arrow-down text-2xl"></i><span>CSVファイルをダウンロード</span>'; } }
        };

        async function init() {
            try {
                const docId = getUsageDocId();
                const snap = await getDoc(doc(db, "system_usage", docId));
                if (snap.exists() && snap.data().count >= 10000) { setExportLock(true, "本日は上限到達"); }
            } catch (e) { console.error(e); }
            try {
                const snap = await getDoc(doc(db, "master_settings", "qual_options"));
                const attrSelect = document.getElementById('attrFilter');
                if (snap.exists() && attrSelect) {
                    const d = snap.data();
                    const options = (d.custSegments || []).map(s => `<option value="${s}">${s}</option>`).join('');
                    attrSelect.innerHTML = `<option value="ALL">すべての属性</option>${options}`;
                }
            } catch (e) { console.error(e); }
            const today = new Date();
            const firstDay = new Date(today.getFullYear(), today.getMonth(), 1);
            document.getElementById('dateStart').value = firstDay.toISOString().split('T')[0];
            document.getElementById('dateEnd').value = today.toISOString().split('T')[0];
            const grid = document.getElementById('columnGrid');
            grid.innerHTML = COLUMNS.map(col => `
                <label class="checkbox-card ${col.default ? 'active' : ''}">
                    <input type="checkbox" value="${col.id}" ${col.default ? 'checked' : ''} onchange="this.parentElement.classList.toggle('active', this.checked)">
                    <span class="text-[11px] font-black tracking-tighter">${col.label}</span>
                </label>`).join('');
            try {
                const snap = await getDocs(query(collection(db, "staffs"), orderBy("name")));
                const select = document.getElementById('visitorFilter');
                snap.forEach(d => { select.insertAdjacentHTML('beforeend', `<option value="${d.data().name}">${d.data().name}</option>`); });
            } catch(e) { console.error(e); }
            const searchInput = document.getElementById('customerSearch');
            searchInput.addEventListener('blur', () => window.updateCount());
            searchInput.addEventListener('keydown', (e) => { if(e.key === 'Enter') window.updateCount(); });
            window.updateCount();
        }

        window.setQuickPeriod = (type) => {
            const today = new Date();
            let start, end;
            if (type === 'thisMonth') { start = new Date(today.getFullYear(), today.getMonth(), 1); end = today; }
            else if (type === 'lastMonth') { start = new Date(today.getFullYear(), today.getMonth() - 1, 1); end = new Date(today.getFullYear(), today.getMonth(), 0); }
            document.getElementById('dateStart').value = start.toISOString().split('T')[0];
            document.getElementById('dateEnd').value = end.toISOString().split('T')[0];
            window.updateCount();
        };

        window.toggleAllChecks = (state) => {
            document.querySelectorAll('#columnGrid input').forEach(el => {
                el.checked = state;
                el.parentElement.classList.toggle('active', state);
            });
        };

        init();
    </script>
</body>
</html>
