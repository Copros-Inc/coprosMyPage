<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>実績CSV出力 | CP My Page</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --copros-blue: #87ceeb; --copros-orange: #ff7e11; --copros-navy: #004098; }
        body { font-family: "Hiragino Kaku Gothic ProN", Meiryo, sans-serif; background-color: #f1f5f9; }
        
        /* 統一されたカードデザイン */
        .section-card { background: white; border-radius: 1.5rem; border: 1px solid #e2e8f0; box-shadow: 0 10px 25px rgba(0,0,0,0.04); padding: 2rem; margin-bottom: 1.5rem; }
        
        /* 最新ページ共通の見出しスタイル */
        .section-title { font-size: 0.75rem; font-weight: 900; color: #94a3b8; letter-spacing: 0.1em; border-bottom: 2px solid #f1f5f9; padding-bottom: 0.5rem; margin-bottom: 1.5rem; text-transform: uppercase; }
        
        /* フォーム入力の親切設計 */
        .form-input { width: 100%; padding: 0.75rem 1rem; background-color: #f8fafc; border: 1px solid #e2e8f0; border-radius: 0.75rem; font-weight: 800; font-size: 0.9rem; outline: none; transition: all 0.2s; color: #334155; }
        .form-input:focus { border-color: var(--copros-orange); background-color: white; box-shadow: 0 0 0 4px rgba(255, 126, 17, 0.05); }
        
        /* チェックボックスのスタイリッシュ演出 */
        .checkbox-card { cursor: pointer; display: flex; align-items: center; gap: 0.75rem; padding: 0.75rem 1rem; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 1rem; transition: all 0.2s; }
        .checkbox-card:hover { transform: translateY(-2px); border-color: var(--copros-blue); }
        .checkbox-card.active { background: #eff6ff; border-color: var(--copros-navy); color: var(--copros-navy); box-shadow: 0 4px 12px rgba(0,64,152,0.1); }
        .checkbox-card input { width: 1.1rem; height: 1.1rem; accent-color: var(--copros-navy); }
        
        /* クイックボタン */
        .quick-btn { padding: 0.5rem 1rem; border-radius: 0.75rem; font-size: 0.7rem; font-weight: 900; background: white; border: 1px solid #e2e8f0; color: #64748b; transition: all 0.2s; }
        .quick-btn:hover { background: var(--copros-navy); color: white; border-color: var(--copros-navy); }
        
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="flex h-screen overflow-hidden text-slate-700">
    <div id="sidebar-placeholder"></div>
    <main class="flex-1 flex flex-col overflow-hidden">
        <div id="header-placeholder"></div>
        <div class="flex-1 overflow-y-auto p-4 lg:p-8 custom-scrollbar">
            <div class="max-w-4xl mx-auto">
                <div class="flex flex-col lg:flex-row justify-between items-start lg:items-end mb-10 gap-4">
                    <div>
                        <h1 class="text-3xl lg:text-4xl font-black text-slate-800 tracking-tighter mb-2">実績CSV出力</h1>
                        <nav class="text-[10px] font-black text-slate-400 uppercase tracking-widest italic italic mb-4">Activity Data Export Center</nav>
                        <p class="text-sm font-bold text-slate-500 border-l-4 border-orange-500 pl-4">必要な条件を指定して、実績データを一括ダウンロードします。</p>
                    </div>
                    <button onclick="history.back()" class="px-6 py-2.5 bg-white border border-slate-200 text-slate-500 rounded-xl font-bold text-xs hover:bg-slate-50 shadow-sm transition-all">戻る</button>
                </div>

                <!-- 1. 抽出条件 -->
                <div class="section-card">
                    <p class="section-title">Step 01. 抽出範囲を指定</p>
                    <div class="space-y-6">
                        <div>
                            <div class="flex justify-between items-center mb-3">
                                <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest">対象期間（訪問日）</label>
                                <div class="flex gap-2">
                                    <button onclick="window.setQuickPeriod('thisMonth')" class="quick-btn">今月</button>
                                    <button onclick="window.setQuickPeriod('lastMonth')" class="quick-btn">先月</button>
                                </div>
                            </div>
                            <div class="flex flex-col sm:flex-row items-center gap-3">
                                <input type="date" id="dateStart" class="form-input" onchange="window.updateCount()">
                                <span class="font-black text-slate-300">〜</span>
                                <input type="date" id="dateEnd" class="form-input" onchange="window.updateCount()">
                            </div>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div>
                                <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-3 block">訪問者</label>
                                <select id="visitorFilter" class="form-input" onchange="window.updateCount()">
                                    <option value="ALL">全員分を出力</option>
                                </select>
                            </div>
                            <div>
                                <label class="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-3 block">顧客ランク</label>
                                <select id="rankFilter" class="form-input" onchange="window.updateCount()">
                                    <option value="ALL">すべてのランク</option>
                                    <option>Aa</option><option>Ab</option><option>Ac</option><option>Ad</option>
                                    <option>Ba</option><option>Bb</option><option>Bc</option><option>Bd</option>
                                    <option>Ca</option><option>Cb</option><option>Cc</option><option>Cd</option>
                                    <option>取引先</option><option>合併</option><option>廃業</option>
                                </select>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 2. 出力項目 -->
                <div class="section-card">
                    <div class="flex justify-between items-center mb-6">
                        <p class="section-title mb-0 border-0">Step 02. 出力項目を選択</p>
                        <div class="flex gap-3">
                            <button onclick="window.toggleAllChecks(true)" class="text-[10px] font-black text-blue-500 hover:underline">すべて選択</button>
                            <button onclick="window.toggleAllChecks(false)" class="text-[10px] font-black text-slate-400 hover:underline">解除</button>
                        </div>
                    </div>
                    <div id="columnGrid" class="grid grid-cols-2 md:grid-cols-3 gap-3">
                        <!-- JSで生成 -->
                    </div>
                </div>

                <!-- 3. 実行エリア -->
                <div class="flex flex-col items-center py-12 gap-6">
                    <div class="flex items-center gap-4 px-6 py-3 bg-slate-100 rounded-full border border-slate-200">
                        <span class="text-[11px] font-black text-slate-400 uppercase tracking-widest">対象データ件数</span>
                        <span id="matchCount" class="text-xl font-black text-[#004098]">0</span>
                        <span class="text-xs font-bold text-slate-500">件</span>
                    </div>
                    
                    <button id="exportBtn" onclick="window.executeExport()" class="w-full max-w-sm py-5 bg-[#004098] text-white rounded-2xl font-black text-lg hover:shadow-2xl hover:-translate-y-1 active:scale-95 transition-all flex items-center justify-center gap-4 disabled:opacity-30 disabled:translate-y-0 disabled:cursor-not-allowed shadow-lg">
                        <i class="fa-solid fa-cloud-arrow-down text-2xl"></i>
                        <span>CSVファイルをダウンロード</span>
                    </button>
                    
                    <div class="flex items-center gap-2 text-[10px] font-black text-slate-400 italic">
                        <i class="fa-solid fa-circle-info"></i>
                        <span>Excelで開いても文字化けしない形式(BOM付き)で出力されます</span>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script type="module" src="common.js"></script>
    <script type="module">
        import { db } from "./common.js";
        import { collection, getDocs, query, where, orderBy, getCountFromServer } 
            from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // 実績登録画面のフィールド名と完全に一致させています
        const COLUMNS = [
            { id: "visitDate", label: "訪問日", default: true },
            { id: "visitorName", label: "訪問者", default: true },
            { id: "customerName", label: "お客様名", default: true },
            { id: "customerRank", label: "ランク", default: true },
            { id: "customerAttr", label: "属性", default: true },
            { id: "customerStaffName", label: "先方担当者", default: true },
            { id: "companion", label: "同行者", default: true },
            { id: "startTime", label: "開始", default: false },
            { id: "endTime", label: "終了", default: false },
            { id: "qualData1", label: "定性1", default: false },
            { id: "qualData2", label: "定性2", default: false },
            { id: "qualData3", label: "定性3", default: false },
            { id: "qualFree", label: "定性自由", default: false },
            { id: "content", label: "報告内容", default: true },
            { id: "staffThoughts", label: "スタッフの考え", default: true },
            { id: "nextVisitDate", label: "次回予定", default: false }
        ];

        async function init() {
            // 初期期間設定（今月1日〜今日）
            const today = new Date();
            const firstDay = new Date(today.getFullYear(), today.getMonth(), 1);
            document.getElementById('dateStart').value = firstDay.toISOString().split('T')[0];
            document.getElementById('dateEnd').value = today.toISOString().split('T')[0];

            // 項目生成
            const grid = document.getElementById('columnGrid');
            grid.innerHTML = COLUMNS.map(col => `
                <label class="checkbox-card ${col.default ? 'active' : ''}">
                    <input type="checkbox" value="${col.id}" ${col.default ? 'checked' : ''} onchange="this.parentElement.classList.toggle('active', this.checked)">
                    <span class="text-[11px] font-black tracking-tighter">${col.label}</span>
                </label>
            `).join('');

            // 訪問者リストの取得（キャッシュ優先を検討しても良いが、ここは常に最新が良い）
            try {
                const snap = await getDocs(query(collection(db, "staffs"), orderBy("name")));
                const select = document.getElementById('visitorFilter');
                snap.forEach(d => {
                    const name = d.data().name;
                    select.insertAdjacentHTML('beforeend', `<option value="${name}">${name}</option>`);
                });
            } catch(e) { console.error(e); }

            window.updateCount();
        }

        window.setQuickPeriod = (type) => {
            const today = new Date();
            let start, end;
            if (type === 'thisMonth') {
                start = new Date(today.getFullYear(), today.getMonth(), 1);
                end = today;
            } else if (type === 'lastMonth') {
                start = new Date(today.getFullYear(), today.getMonth() - 1, 1);
                end = new Date(today.getFullYear(), today.getMonth(), 0);
            }
            document.getElementById('dateStart').value = start.toISOString().split('T')[0];
            document.getElementById('dateEnd').value = end.toISOString().split('T')[0];
            window.updateCount();
        };

        window.toggleAllChecks = (state) => {
            document.querySelectorAll('#columnGrid input').forEach(el => {
                el.checked = state;
                el.parentElement.classList.toggle('active', state);
            });
        };

        // 🌟 省エネ設計：件数確認は Firestore の課金対象を最小限にする count() を使用
        window.updateCount = async () => {
            const btn = document.getElementById('exportBtn');
            const badge = document.getElementById('matchCount');
            const start = document.getElementById('dateStart').value.replace(/-/g, '/');
            const end = document.getElementById('dateEnd').value.replace(/-/g, '/');
            const visitor = document.getElementById('visitorFilter').value;
            const rank = document.getElementById('rankFilter').value;

            try {
                let q = query(
                    collection(db, "activity_records"),
                    where("visitDate", ">=", start),
                    where("visitDate", "<=", end)
                );
                
                if (visitor !== 'ALL') q = query(q, where("visitorName", "==", visitor));
                if (rank !== 'ALL') q = query(q, where("customerRank", "==", rank));

                const snap = await getCountFromServer(q);
                const count = snap.data().count;
                badge.innerText = count;
                btn.disabled = (count === 0);
                badge.style.color = count > 0 ? 'var(--copros-navy)' : '#cbd5e1';
            } catch (e) {
                console.error(e);
            }
        };

        window.executeExport = async () => {
            const btn = document.getElementById('exportBtn');
            const originalHTML = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i>生成中...';

            const start = document.getElementById('dateStart').value.replace(/-/g, '/');
            const end = document.getElementById('dateEnd').value.replace(/-/g, '/');
            const visitor = document.getElementById('visitorFilter').value;
            const rank = document.getElementById('rankFilter').value;

            const selectedCols = Array.from(document.querySelectorAll('#columnGrid input:checked')).map(el => {
                return COLUMNS.find(c => c.id === el.value);
            });

            try {
                let q = query(
                    collection(db, "activity_records"),
                    where("visitDate", ">=", start),
                    where("visitDate", "<=", end),
                    orderBy("visitDate", "desc")
                );
                
                if (visitor !== 'ALL') q = query(q, where("visitorName", "==", visitor));
                if (rank !== 'ALL') q = query(q, where("customerRank", "==", rank));

                const snap = await getDocs(q);
                
                // BOM付きCSVでExcel対策
                let csvContent = "\uFEFF"; 
                csvContent += selectedCols.map(c => `"${c.label}"`).join(",") + "\n";

                snap.forEach(doc => {
                    const data = doc.data();
                    const row = selectedCols.map(c => {
                        let val = data[c.id] || "";
                        // セル内の改行やダブルクォートを適切に処理
                        return `"${val.toString().replace(/"/g, '""')}"`;
                    });
                    csvContent += row.join(",") + "\n";
                });

                const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
                const url = URL.createObjectURL(blob);
                const link = document.createElement("a");
                link.setAttribute("href", url);
                link.setAttribute("download", `実績出力_${start.replace(/\//g,'')}-${end.replace(/\//g,'')}.csv`);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);

            } catch (e) {
                alert("エクスポート中にエラーが発生しました: " + e.message);
            } finally {
                btn.disabled = false;
                btn.innerHTML = originalHTML;
            }
        };

        init();
    </script>
</body>
</html>
