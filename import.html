<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8"><title>データ一括登録 | CP My Page</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --copros-blue: #004098; --copros-orange: #ff7e11; }
        body { font-family: "Hiragino Kaku Gothic ProN", Meiryo, sans-serif; background-color: #f1f5f9; }
        .form-card { background: white; border-radius: 2rem; border: 1px solid #e2e8f0; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05); }
        .tab-btn { transition: all 0.3s; border-bottom: 3px solid transparent; opacity: 0.4; padding-bottom: 1rem; font-weight: 900; cursor: pointer; }
        .tab-btn.active { opacity: 1; }
        .tab-staffs.active { color: #0ea5e9; border-bottom-color: #0ea5e9; }
        .tab-customers.active { color: var(--copros-orange); border-bottom-color: var(--copros-orange); }
        .tab-records.active { color: #10b981; border-bottom-color: #10b981; }
        .console-log { background: #0f172a; color: #34d399; font-family: 'Consolas', 'Monaco', monospace; font-size: 0.7rem; border-radius: 1rem; padding: 1.2rem; height: 350px; overflow-y: auto; border: 4px solid #1e293b; line-height: 1.6; }
        .log-error { color: #f87171; }
        .log-info { color: #60a5fa; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
    </style>
</head>
<body class="flex h-screen overflow-hidden text-slate-700">
<div id="sidebar-placeholder"></div>
<main class="flex-1 flex flex-col overflow-hidden">
    <div id="header-placeholder"></div>
    <div class="flex-1 overflow-y-auto p-8 custom-scrollbar">
        <div class="max-w-5xl mx-auto">
            <div class="flex justify-between items-end mb-8">
                <h1 class="text-3xl lg:text-4xl font-black text-slate-800 tracking-tighter mb-1">データ一括登録</h1>
            </div>

            <div class="form-card p-8 lg:p-10 mb-8">
                <div class="flex gap-10 border-b border-slate-100 mb-8">
                    <button onclick="window.switchTab('customers')" id="tab-customers" class="tab-btn tab-customers">お客様名簿</button>
                    <button onclick="window.switchTab('staffs')" id="tab-staffs" class="tab-btn tab-staffs">社員名簿</button>
                    <button onclick="window.switchTab('activity_records')" id="tab-records" class="tab-btn tab-records active">実績データ</button>
                </div>

                <div id="importGuide" class="p-6 rounded-2xl mb-8 border border-slate-100 bg-slate-50/50">
                    <p class="text-[10px] font-black text-slate-400 mb-3 uppercase tracking-tighter">Excelの列順序（見出し行は含めずコピー）</p>
                    <div id="columnMapping" class="text-[11px] font-mono font-black text-[#004098]"></div>
                </div>

                <textarea id="csvData" class="w-full h-64 p-6 bg-slate-50 border border-slate-200 rounded-2xl focus:outline-none font-mono text-xs mb-8" placeholder="データをここに貼り付けてください"></textarea>

                <button id="importBtn" class="w-full py-5 text-white rounded-2xl font-black shadow-lg transition-all active:scale-[0.98]">
                    インポートを開始する
                </button>
                <!-- 🌟 追加：全削除ボタン -->
                <button id="deleteBtn" class="w-full py-3 mt-4 text-rose-500 border-2 border-rose-500 rounded-2xl font-black hover:bg-rose-50 transition-all active:scale-[0.98]">
                    選択中のカテゴリを全削除する
                </button>                
            </div>

            <div class="bg-white p-6 rounded-[2rem] border border-slate-200 shadow-sm mb-20">
                <div id="statusLog" class="console-log custom-scrollbar">待機中...</div>
            </div>
        </div>
    </div>
</main>

<script type="module" src="common.js"></script>
<script type="module">
    import { db, getDisplayDept } from "./common.js";
    import { collection, doc, setDoc, addDoc, writeBatch, serverTimestamp, getDocs, query, limit } 
    from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    let currentMode = 'activity_records';
    let staffMap = new Map();

    const mapping = {
        customers: "A:お客様名 | B:カナ | C:ランク | D:属性 | E:住所 | F:電話 | G:回数 | H:最終 | I:lat | J:lng",
        staffs: "A:ID | B:氏名 | C:パス | D:メール | E:権限 | F:状態 | G:部署",
        activity_records: "A:お客様名 | B:ランク | C:属性 | D:担当 | E:開始 | F:終了 | G:内容 | H:訪問者 | I:同行 | J:定性1 | K:定性2 | L:定性3 | M:自由 | N:報告 | O:考え"
    };

    // 🌟 高度な行分割（セル内の改行を保護する）
    function parseCSV(text) {
        const rows = [];
        let currentRow = [];
        let currentCell = '';
        let inQuotes = false;
        const delimiter = text.includes('\t') ? '\t' : ','; // タブかカンマを自動判別

        for (let i = 0; i < text.length; i++) {
            const char = text[i];
            const nextChar = text[i + 1];

            if (char === '"' && inQuotes && nextChar === '"') {
                currentCell += '"'; i++;
            } else if (char === '"') {
                inQuotes = !inQuotes;
            } else if (char === delimiter && !inQuotes) {
                currentRow.push(currentCell);
                currentCell = '';
            } else if ((char === '\r' || char === '\n') && !inQuotes) {
                if (currentCell !== '' || currentRow.length > 0) {
                    currentRow.push(currentCell);
                    rows.push(currentRow);
                    currentCell = '';
                    currentRow = [];
                }
                if (char === '\r' && nextChar === '\n') i++;
            } else {
                currentCell += char;
            }
        }
        if (currentCell !== '' || currentRow.length > 0) {
            currentRow.push(currentCell);
            rows.push(currentRow);
        }
        return rows;
    }

    const cleanDate = (s) => {
        if (!s || s === "0" || s.includes("未訪問")) return "未訪問";
        const parts = s.trim().replace(/\//g, '-').replace(/\s+/g, '-').split('-');
        if (parts.length < 3) return s;
        // 🌟 2024/09/26 形式に統一（0埋め対応）
        return `${parts[0]}/${parts[1].padStart(2, '0')}/${parts[2].padStart(2, '0')}`;
    };

    // 🌟 追加：名寄せ用の「合言葉」を作る関数（スペース・法人格を無視）
const createMatchKey = (s) => {
    if (!s) return "";
    return s.toString()
        .replace(/[\s\u3000]+/g, '')        // 全角半角スペースを削除
        .replace(/[（(].*?[)）]/g, '')      // (株) や (有) などのカッコ内を削除
        .replace(/株式会社|有限会社|合同会社/g, '') // 法人格の文字を削除
        .trim();
};

    window.switchTab = (mode) => {
        currentMode = mode;
        const btn = document.getElementById('importBtn');
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(mode === 'activity_records' ? 'tab-records' : `tab-${mode}`).classList.add('active');
        document.getElementById('columnMapping').innerText = mapping[mode];
        btn.className = "w-full py-5 text-white rounded-2xl font-black " + (mode==='staffs'?'bg-sky-500':mode==='customers'?'bg-[#ff7e11]':'bg-emerald-500');
    };

    function log(msg, type = "success") {
        const div = document.getElementById('statusLog');
        div.innerHTML += `<div class="log-${type}">[${new Date().toLocaleTimeString()}] ${msg}</div>`;
        div.scrollTop = div.scrollHeight;
    }

    document.getElementById('importBtn').onclick = async () => {
        const rawData = document.getElementById('csvData').value.trim();
        if (!rawData) return alert("データがありません。");
        
        const rows = parseCSV(rawData);
        const total = rows.length;
        const btn = document.getElementById('importBtn');
        
        if(!confirm(`${total}件のインポートを開始しますか？\n※50件ずつのバッチ処理で高速実行します。`)) return;

        btn.disabled = true;
        document.getElementById('statusLog').innerHTML = "";
        log(`${total}件のデータを解析しました。照合を開始します...`, "info");

        // 社員部署マップ作成
// 141行目付近の sSnap 取得部分を修正
log(`データの解析を開始します...`, "info");

// 社員名簿が必要なのは実績データ（activity_records）の時だけ
if (currentMode === 'activity_records' && staffMap.size === 0) {
    const sSnap = await getDocs(collection(db, "staffs"));
    sSnap.forEach(d => staffMap.set(d.data().name.replace(/\s+/g, ''), d.data().dept || "不明"));
}

        let batch = writeBatch(db);
        let count = 0;

        for (let i = 0; i < rows.length; i++) {
            const col = rows[i];
            try {
                // currentMode (customers 等) に応じてリファレンスを作成
                const ref = doc(collection(db, currentMode));

if (currentMode === 'customers') {
    const rawName = col[0]?.trim() || "";
    const mKey = createMatchKey(rawName); // 名寄せ用の合言葉
    if (!mKey) return; // 名前がなければスキップ

    // 🌟省エネの極意：ドキュメントIDに mKey を使うことで、
    // 事前の「検索（読み取り）」を不要にし、いきなり保存（書き込み）します。
    const customerRef = doc(db, "customers", mKey); 

    batch.set(customerRef, {
       name: rawName,
       matchKey: mKey,
       kana: col[1]?.trim() || "",
       rank: col[2]?.trim() || "-",
       type: col[3]?.trim() || "-",
       address: col[4]?.trim() || "",
       tel: col[5]?.trim() || "",
       visitCount: parseInt(col[6]) || 0,
       lastVisitDate: cleanDate(col[7]),
       lat: col[8] ? parseFloat(col[8]) : null, // 🌟追加：I列(緯度)
       lng: col[9] ? parseFloat(col[9]) : null, // 🌟追加：J列(経度)
       updatedAt: serverTimestamp()
    }, { merge: true }); // 🌟既存のデータがある場合は「合体」させる
}
                else if (currentMode === 'activity_records') {
                    const rawCustName = col[0]?.trim() || "";
                    const startFull   = (col[4]||"").trim().split(' '); // E列
                    const endFull     = (col[5]||"").trim().split(' '); // F列
                    
                    const visitDate   = cleanDate(startFull[0]);
                    const startTime   = startFull[1] || "00:00";
                    const endTime     = endFull[1]   || "00:00";

                    const visitorNameRaw = col[7]?.trim() || "不明"; // H列
                    const visitorNameClean = visitorNameRaw.replace(/\s+/g, '');
                    const rawDept = staffMap.get(visitorNameClean) || "その他の部署";
                    const dept = getDisplayDept(rawDept);

                    batch.set(ref, {
                        customerName:      rawCustName,
                        matchKey:          createMatchKey(rawCustName),
                        customerRank:      col[1]?.trim() || "-", // B列
                        customerAttr:      col[2]?.trim() || "-", // C列
                        customerStaffName: col[3]?.trim() || "-", // D列
                        visitDate:         visitDate,
                        startTime:         startTime,
                        endTime:           endTime,
                        activityType:      col[6]?.trim() || "営業", // G列
                        visitorName:       visitorNameRaw,
                        companion:         col[8]?.trim() || "-",    // I列
                        qualData1:         col[9]?.trim() || "-",    // J列
                        qualData2:         col[10]?.trim() || "-",   // K列
                        qualData3:         col[11]?.trim() || "-",   // L列
                        qualFree:          col[12]?.trim() || "-",   // M列:自由項目
                        content:           col[13]?.trim() || "-",   // N列:報告内容
                        staffThoughts:     col[14]?.trim() || "-",   // O列:スタッフの考え
                        visitorDept:       dept,
                        readBy:            [], 
                        createdAt:         serverTimestamp()
                    });
                }
                
                count++;
                // 50件ごとに書き込み実行
                if (count === 50 || i === rows.length - 1) {
                    await batch.commit();
                    log(`${i + 1} / ${total} 件完了...`);
                    batch = writeBatch(db);
                    count = 0;
                }
            } catch (e) { log(`${i+1}行目エラー: ${e.message}`, "error"); }
        }
        log("全てのインポート処理が完了しました！", "info");
        btn.disabled = false;
        alert("インポートが完了しました。");
    };

document.getElementById('deleteBtn').onclick = async () => {
    const mode = currentMode;
    const modeName = mode === 'customers' ? 'お客様名簿' : mode === 'staffs' ? '社員名簿' : '実績データ';
    
    // 二重の警告で誤操作防止
    if (!confirm(`【最終確認】${modeName} の全データを削除します。\nこの操作は取り消せません。よろしいですか？`)) return;
    const safetyCode = prompt("安全のため、半角で「DELETE」と入力してください");
    if (safetyCode !== "DELETE") return alert("処理を中止しました");

    const btn = document.getElementById('deleteBtn');
    btn.disabled = true;
    btn.innerText = "削除中...";

    try {
        let totalDeleted = 0;
        let hasData = true;

        while (hasData) {
            // 省エネのコツ：ドキュメントIDだけを取得するように制限（フィールド読み取りを最小化）
            // Firestoreには「IDのみ取得」がないため、最小限のデータで取得
            const q = query(collection(db, mode), limit(500)); 
            const snap = await getDocs(q);
            
            if (snap.empty) {
                hasData = false;
                break;
            }

            const batch = writeBatch(db);
            snap.forEach(d => batch.delete(d.ref));
            await batch.commit();

            totalDeleted += snap.size;
            log(`${totalDeleted} 件の削除を完了...`, "info");
            
            // 連続実行による負荷とクォータ消費を抑えるための待機
            await new Promise(r => setTimeout(r, 500));
        }
        log(`削除完了: 合計 ${totalDeleted} 件`, "success");
        alert("削除が完了しました。");
    } catch (e) { 
        log("削除エラー: " + e.message, "error");
        alert("エラーが発生しました: " + e.message);
    } finally { 
        btn.disabled = false; 
        btn.innerText = "選択中のカテゴリを全削除する"; 
    }
};
    
    window.switchTab('activity_records');
</script>
</body>
</html>
