<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>実績一覧 | CP My Page</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --copros-orange: #ff7e11; --copros-navy: #004098; }
        body { font-family: "Hiragino Kaku Gothic ProN", Meiryo, sans-serif; background-color: #f1f5f9; }
        .filter-btn { border: 1px solid #e2e8f0; color: #64748b; background: white; transition: all 0.2s; font-weight: 900; padding: 0.5rem 0.8rem; cursor: pointer; border-radius: 0.75rem; font-size: 0.75rem; }
        .filter-btn.active { background: var(--copros-orange) !important; color: white !important; border-color: var(--copros-orange); box-shadow: 0 4px 12px rgba(255,126,17,0.3); }
        .table-container { border-radius: 1.5rem; overflow: hidden; background: white; box-shadow: 0 10px 30px rgba(0,0,0,0.04); border: 1px solid #e2e8f0; }
        thead tr { background-color: #3c4b5a; }
        .scope-select { background: #e2e8f0; border: none; padding: 0.4rem 1rem; border-radius: 0.75rem; font-size: 0.75rem; font-weight: 900; color: #475569; outline: none; cursor: pointer; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
                /* 📱 モバイル完全対応：実績一覧カード形式 */
        @media (max-width: 768px) {
            html, body { overflow-x: hidden !important; width: 100% !important; }
            main { overflow-x: hidden !important; width: 100% !important; padding: 0 !important; }
            .max-w-\[1400px\] { width: 100% !important; padding: 10px !important; margin: 0 !important; box-sizing: border-box !important; }

            /* 上部ヘッダーの整理 */
            .flex.justify-between.items-end { flex-direction: column !important; align-items: flex-start !important; gap: 15px !important; }
            .flex.flex-wrap.gap-2.bg-white { width: 100% !important; display: grid !important; grid-template-columns: 1fr 1fr 1fr !important; gap: 5px !important; padding: 6px !important; }
            .flex.flex-wrap.gap-2.bg-white button { padding: 10px 2px !important; font-size: 10px !important; flex-direction: column !important; border-radius: 12px !important; }
            .flex.flex-wrap.gap-2.bg-white .w-px { display: none !important; }

            /* カード化 */
            .table-container { border: none !important; background: transparent !important; box-shadow: none !important; overflow: visible !important; width: 100% !important; }
            table { min-width: 0 !important; width: 100% !important; table-layout: fixed !important; }
            tbody, tr, td { display: block !important; width: 100% !important; box-sizing: border-box !important; }
            thead { display: none !important; }

            tbody tr {
                background: white !important;
                margin-bottom: 12px !important;
                padding: 15px !important;
                border-radius: 1.5rem !important;
                border: 1px solid #e2e8f0 !important;
                position: relative !important;
            }

            td { text-align: left !important; padding: 2px 0 !important; border: none !important; }

            /* 番号とチェックボックス（四隅） */
            td:nth-child(1) { position: absolute; top: 15px; left: 15px; font-size: 10px; color: #cbd5e1; width: auto !important; }
            td:nth-child(6) { position: absolute; top: 15px; right: 10px; width: auto !important; }

            /* お客様名 */
            td:nth-child(2) { font-size: 1.1rem !important; font-weight: 900 !important; color: var(--copros-navy) !important; padding: 10px 0 5px 0 !important; width: 90% !important; line-height: 1.2; }

            /* 訪問者情報 */
            td:nth-child(4) { border-top: 1px solid #f1f5f9; padding-top: 10px !important; margin-top: 5px !important; font-size: 14px !important; }
            td:nth-child(4):before { content: "👤 "; }
            
            /* 日時・滞在時間 */
            td:nth-child(3) { font-size: 12px !important; color: #64748b !important; }
            td:nth-child(3):before { content: "📅 "; }
            td:nth-child(3) .text-[#0ea5e9] { display: inline-block; margin-left: 10px; font-weight: 900; }

            /* 履歴ボタン（右下配置） */
            td:nth-child(5) { position: absolute; bottom: 15px; right: 15px; width: auto !important; }
            td:nth-child(5) button { width: 44px !important; height: 44px !important; border-radius: 12px !important; }
        }
    </style>
</head>
<body class="flex h-screen overflow-hidden text-slate-700 font-sans">
    <div id="sidebar-placeholder"></div>
    <main class="flex-1 flex flex-col overflow-hidden">
        <div id="header-placeholder"></div>
        <div class="flex-1 overflow-auto p-4 lg:p-8 custom-scrollbar">
            <div class="max-w-[1400px] mx-auto">

                <div class="flex justify-between items-end mb-8 gap-4">
                    <div class="flex items-end gap-6">
                        <div>
                            <h1 class="text-3xl lg:text-4xl font-black text-slate-800 tracking-tighter mb-1">実績一覧</h1>
                            <nav class="text-[10px] font-black text-slate-400 uppercase tracking-widest italic">Activity History Log</nav>
                        </div>
<select id="deptFilter" onchange="window.executeSearch()" class="scope-select shadow-inner mb-2">
    <option value="ALL">全社員を表示</option>
    <option>ケコム部</option>
    <option>関西支店</option>
    <option>関東支店</option>
    <option>中部営業所</option>
    <option value="OTHER">その他の部署</option>
</select>
                    </div>
                    <div class="flex flex-wrap gap-2 bg-white p-1.5 rounded-2xl shadow-sm border border-slate-100 items-center shrink-0 ml-auto">
                        <button onclick="document.getElementById('detailSearchSection').classList.toggle('hidden')" class="px-5 py-2.5 text-slate-500 rounded-xl font-bold text-xs hover:bg-slate-50 flex items-center gap-2 transition-all">
                            <i class="fa-solid fa-sliders text-blue-400"></i> 詳細検索
                        </button>
                        <div class="w-px h-6 bg-slate-100 mx-1"></div>
                        <button onclick="location.href='history.html'" class="px-8 py-2.5 bg-[#004098] text-white rounded-xl font-bold text-xs hover:shadow-lg transition-all flex items-center gap-2 active:scale-95">
                            <i class="fa-solid fa-plus-circle"></i> 実績登録
                        </button>
                        <div class="w-px h-6 bg-slate-100 mx-1"></div>
<button onclick="window.editSelectedRecord()" class="px-6 py-2.5 text-blue-500 rounded-xl font-bold text-xs hover:bg-blue-50 flex items-center gap-2 transition-all">
    <i class="fa-solid fa-pen-to-square"></i> 編集 / 削除
</button>
                    </div>
                </div>

                <!-- 詳細検索エリア（既存まま） -->
                <div id="detailSearchSection" class="hidden mb-8 p-8 bg-white rounded-[2rem] shadow-xl border border-blue-50">
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 text-xs font-bold">
                        <div class="space-y-2">
                            <label class="text-slate-400">お客様名</label>
                            <input type="text" id="filterCustomer" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:border-orange-400" placeholder="お客様名で検索">
                        </div>
                        <div class="space-y-2">
                            <label class="text-slate-400">訪問者名</label>
                            <input type="text" id="filterVisitor" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl outline-none focus:border-orange-400" placeholder="氏名検索">
                        </div>
                        <div class="md:col-span-2 space-y-2">
                            <label class="text-slate-400">訪問期間</label>
                            <div class="flex items-center gap-2">
                                <input type="date" id="startDate" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl">
                                <span>〜</span>
                                <input type="date" id="endDate" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl">
                            </div>
                        </div>
                    </div>
                    <div class="flex justify-center gap-4 mt-8">
                        <button onclick="window.executeSearch()" class="bg-slate-800 text-white px-16 py-3 rounded-xl font-black shadow-lg active:scale-95 transition-all">検索を実行</button>
                        <button onclick="window.clearSearch()" class="text-slate-400 px-8 py-3 font-bold hover:text-slate-600 transition-colors">クリア</button>
                    </div>
                </div>

                <!-- 🌟 修正：月送りナビゲーター（中央配置・年表示版） -->
                <div class="flex flex-col items-center mb-10 px-2 gap-4">
                    <div class="flex items-center gap-6 bg-white p-2 rounded-2xl border border-slate-200 shadow-sm font-black text-[#004098]">
                        <button onclick="window.changeMonth(-1)" class="w-12 h-12 flex items-center justify-center rounded-xl hover:bg-slate-50 text-slate-300 transition-all"><i class="fa-solid fa-chevron-left text-lg"></i></button>
                        <div id="currentMonthDisplay" class="text-xl font-black text-slate-800 min-w-[180px] text-center tracking-tighter italic">2026年 10月</div>
                        <button onclick="window.changeMonth(1)" class="w-12 h-12 flex items-center justify-center rounded-xl hover:bg-slate-50 text-slate-300 transition-all"><i class="fa-solid fa-chevron-right text-lg"></i></button>
                    </div>
                    <div class="text-slate-400 font-bold text-[10px] uppercase tracking-widest bg-white/50 px-4 py-1.5 rounded-full border border-slate-100 shadow-sm">
                        <span id="totalDisplay" class="text-slate-800 font-black">0</span> Records Found
                    </div>
                </div>

                <div class="table-container overflow-x-auto mb-24">
                    <table class="w-full text-left border-collapse min-w-[1100px]">
                        <thead>
                            <tr class="text-white text-[10px] font-black uppercase text-center tracking-widest">
                                <th class="p-6 w-16 opacity-50">No</th>
                                <th class="p-6 text-left w-[400px]">お客様名</th>
                                <th class="p-6 w-[200px]">訪問日時 / 滞在</th>
                                <th class="p-6 w-[180px]">訪問者</th>
                                <th class="p-6 w-20">履歴</th>
                                <th class="p-6 w-24 opacity-30"><i class="fa-solid fa-check-double"></i></th>
                            </tr>
                        </thead>
                        <tbody id="recordTable" class="divide-y divide-slate-100 text-sm font-bold bg-white text-center">
                            <tr><td colspan="6" class="p-20 text-center text-slate-400 font-bold italic animate-pulse">実績データを同期中...</td></tr>
                        </tbody>
                    </table>
                    <div class="flex justify-center pb-10">
    <button id="moreBtn" onclick="window.executeSearch(true)" class="hidden px-20 py-4 bg-white text-blue-600 border-2 border-blue-600 rounded-2xl font-black hover:bg-blue-50 transition-all active:scale-95 shadow-md">
        もっと見る（次の50件）
    </button>
                </div>
            </div>
        </div>
    </main>

    <script type="module" src="common.js"></script>
    <script type="module">
        import { db, TARGET_DEPTS, getDisplayDept } from "./common.js";
        import { collection, getDocs, query, limit, doc, writeBatch, where, orderBy, startAfter }
            from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        let allRecords  = [];
        let lastVisible = null; 
        let isSearching = false; 
        let currentDisplayDate = new Date(); 

        function normalizeDate(str) {
            if (!str) return "0000-00-00";
            const d = str.toString().replace(/\//g, '-').split('-');
            if (d.length < 3) return str;
            return `${d[0]}-${d[1].padStart(2, '0')}-${d[2].padStart(2, '0')}`;
        }

        // 🌟 追加：月送りナビゲーターの制御
        window.changeMonth = (diff) => {
            currentDisplayDate.setMonth(currentDisplayDate.getMonth() + diff);
            window.renderMonthPicker();
        };

        window.initMonth = () => {
            currentDisplayDate = new Date();
            window.renderMonthPicker();
        };

        window.renderMonthPicker = () => {
            const y = currentDisplayDate.getFullYear();
            const m = currentDisplayDate.getMonth() + 1;
            document.getElementById('currentMonthDisplay').innerText = `${y}年 ${m}月`;
            
            const lastDay = new Date(y, m, 0).getDate();
            const sVal = `${y}-${String(m).padStart(2,'0')}-01`;
            const eVal = `${y}-${String(m).padStart(2,'0')}-${String(lastDay).padStart(2,'0')}`;
            document.getElementById('startDate').value = sVal;
            document.getElementById('endDate').value = eVal;
            
            // 🌟 修正：初期表示や月変更時に自動で検索（limit(50)で省エネ実行）
            window.executeSearch(false);
        };
        
        function loadFromCache(key) {
            try {
                const raw = sessionStorage.getItem(key);
                return raw ? JSON.parse(raw) : null;
            } catch { return null; }
        }

        function saveToCache(key, data) {
            try {
                sessionStorage.setItem(key, JSON.stringify(data));
            } catch {
                // 容量超過時は無視（通信にフォールバック）
            }
        }
       
window.executeSearch = async (append = false) => {
    if (isSearching) return; // 🌟 二重読み込み防止フラグ
    const tbody = document.getElementById('recordTable');
    const moreBtn = document.getElementById('moreBtn');

    const startD = document.getElementById('startDate').value; 
    const endD   = document.getElementById('endDate').value;
   
        // 🌟 検索条件を取得（ここへ移動させます）
        const custK = document.getElementById('filterCustomer').value.trim();
        const visiK = document.getElementById('filterVisitor').value.trim();
        const dept  = document.getElementById('deptFilter').value;
    
    if (!startD || !endD) return;

    const cacheKey = `cp_records_cache_${startD}_${endD}`;

   
    if (!append) {
        // 🌟 ここです！「検索ワードがすべて空」であることを先に確認します
        if (!custK && !visiK && dept === 'ALL') {
            const cached = loadFromCache(cacheKey);
            if (cached) {
                allRecords = cached;
                renderTable(allRecords);
                document.getElementById('totalDisplay').innerText = allRecords.length;
                if (moreBtn) moreBtn.classList.remove('hidden'); 
                return; // ここで終わる（通信 0）
            }
        }
        
        // 🌟 名前が入っている時やキャッシュがない時は、ここを通ってリストをリセットする
        tbody.innerHTML = `<tr><td colspan="6" class="p-20 text-center text-slate-400 animate-pulse">データを同期中...</td></tr>`;
        lastVisible = null;
        allRecords = [];
    }

    isSearching = true; // 🌟 読み込み開始

    try {
        const ref = collection(db, "activity_records");
        const fStart = startD.replace(/-/g, '/');
        const fEnd   = endD.replace(/-/g, '/');
       
        // 🌟 修正：基本の検索条件（日付順）
        let constraints = [
            where("visitDate", ">=", fStart),
            where("visitDate", "<=", fEnd),
            orderBy("visitDate", "desc")
        ];

        // 🌟 省エネ対策：検索時は一度に150件、通常時は50件ずつ取得
        const isFiltering = (custK || visiK || (dept !== 'ALL' && dept !== 'OTHER'));
        constraints.push(limit(isFiltering ? 150 : 50)); 

        if (append && lastVisible) {
            constraints.push(startAfter(lastVisible));
        }

        const q = query(ref, ...constraints);
        const snap = await getDocs(q);

        let docs = snap.docs.map(d => ({ id: d.id, ...d.data() }));

        // 🌟 修正：お客様名・訪問者名の両方を「一文字（部分一致）」で絞り込む
        if (isFiltering) {
            docs = docs.filter(r => {
                // お客様名：入力した文字が含まれているか
                const matchCust = !custK || (r.customerName || "").includes(custK);
                // 訪問者名：入力した文字（苗字など）が含まれているか
                const matchVisi = !visiK || (r.visitorName || "").includes(visiK);
                // 部署：一致しているか
                const matchDept = (dept === 'ALL' || dept === 'OTHER') ? true : (r.visitorDept === dept);
                
                return matchCust && matchVisi && matchDept;
            });
        }
        
        allRecords = append ? [...allRecords, ...docs] : docs;

        if (!custK && !visiK && dept === 'ALL') {
            saveToCache(cacheKey, allRecords);
        }

        // 表示の実行
        renderTable(allRecords);
        document.getElementById('totalDisplay').innerText = allRecords.length;

        // ボタンの制御
        if (moreBtn) {
            if (snap.docs.length > 0) {
                moreBtn.classList.remove('hidden');
            } else {
                moreBtn.classList.add('hidden');
            }
        }
    } catch (e) {
        console.error(e);
        tbody.innerHTML = `<tr><td colspan="6" class="p-20 text-center text-rose-400 font-bold">検索エラー</td></tr>`;
    } finally {
        isSearching = false;
    }
};

window.updateView = () => {
    window.executeSearch(false);
};
                  
        function renderTable(dataList) {
            const tbody = document.getElementById('recordTable');
            if (dataList.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="p-20 text-center text-slate-300 font-bold uppercase tracking-widest">該当する実績はありません</td></tr>`;
                document.getElementById('totalDisplay').innerText = 0;
                return;
            }

            tbody.innerHTML = dataList.map((data, i) => {
                // 既存：滞在時間計算
                let dur = "";
                if (data.startTime && data.endTime && data.startTime !== "00:00") {
                    const s    = data.startTime.split(':');
                    const e    = data.endTime.split(':');
                    const diff = (parseInt(e[0]) * 60 + parseInt(e[1] || 0))
                                - (parseInt(s[0]) * 60 + parseInt(s[1] || 0));
                    if (diff > 0) {
                        dur = `<div class="text-[#0ea5e9] text-[10px] mt-1 font-black">
                                   <i class="fa-regular fa-clock mr-1"></i>滞在: ${diff}分
                               </div>`;
                    }
                }

                // =========================================================
                // ▼▼▼ 修正①：履歴ボタンに rank・attr を追加 ▼▼▼
                // ※ list_records には rank/attr フィールドが activity_records に
                //    保存されていない場合があるため、存在すれば渡す設計にする
                // =========================================================
                const eName = encodeURIComponent(data.customerName || '');
                const eRank = encodeURIComponent(data.customerRank || data.rank || ''); // rankでも拾えるように
　　　　　　     const eAttr = encodeURIComponent(data.customerAttr || data.customerType || data.type || ''); // typeでも拾えるように

                return `
                <tr class="hover:bg-sky-50/50 transition-colors">
                    <td class="p-6 text-slate-300 font-mono text-xs border-r border-slate-50">${i + 1}</td>
                    <td class="p-6 text-left font-black text-slate-800 leading-snug w-[400px]">
                        ${data.customerName || '---'}
                    </td>
                    <td class="p-6 w-[200px]">
                        <div class="text-slate-600 font-mono text-sm">${(data.visitDate || '').replace(/-/g, '/')}</div>
                        <div class="text-[10px] text-slate-400 mt-0.5 font-bold uppercase">
                            ${data.startTime || '00:00'} 〜 ${data.endTime || '00:00'}
                        </div>
                        ${dur}
                    </td>
                    <td class="p-6 w-[180px] text-slate-700 font-bold">
                        ${data.visitorName || '不明'}
                        <br>
<span class="text-[8px] text-slate-400 uppercase font-black tracking-tighter">
    ${getDisplayDept(data.visitorDept)}
</span>
                    </td>
                    <td class="p-6 text-center">

                        <button
                            onclick="location.href='customer_history.html?name=${eName}&rank=${eRank}&attr=${eAttr}&targetDate=${encodeURIComponent((data.visitDate || '').replace(/-/g, '/'))}'"
                            class="w-9 h-9 flex items-center justify-center bg-blue-50 text-[#004098] rounded-xl hover:bg-[#004098] hover:text-white mx-auto transition-all shadow-sm">
                            <i class="fa-solid fa-chevron-right text-xs"></i>
                        </button>
                    </td>
                    <td class="p-6 text-center">
                        <input type="checkbox" class="record-check w-5 h-5 accent-rose-500 rounded-md cursor-pointer border-slate-200" value="${data.id}">
                    </td>
                </tr>`;
            }).join('');

            document.getElementById('totalDisplay').innerText = dataList.length;
        }

// 🌟 修正：明示的に window に登録し、確実に history.html へ飛ばす
window.editSelectedRecord = () => {
    const checks = document.querySelectorAll('.record-check:checked');
    
    if (checks.length === 0) {
        alert("編集したい実績にチェックを入れてください");
        return;
    }
    if (checks.length > 1) {
        alert("一度に編集できるのは1件のみです");
        return;
    }

    const docId = checks[0].value;
    console.log("Editing Record ID:", docId); // デバッグ用

    // 🌟 確実に遷移させる
    const targetUrl = `history.html?editId=${docId}`;
    location.assign(targetUrl);
};

        window.clearSearch = () => {
            document.getElementById('filterCustomer').value = "";
            document.getElementById('filterVisitor').value = "";
            document.getElementById('startDate').value     = "";
            document.getElementById('endDate').value       = "";
        };

        window.initMonth();
    </script>
</body>
