<!DOCTYPE html>
<html lang="ja">
<head><meta charset="UTF-8"><title>データ大掃除ツール【究極版】</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="bg-slate-100 p-8 text-slate-700">
    <div class="max-w-4xl mx-auto bg-white p-8 rounded-3xl shadow-xl">
        <h1 class="text-2xl font-black mb-6 text-center">🧹 データ大掃除【英字徹底抽出】</h1>
        <div class="grid grid-cols-2 gap-4 mb-8">
            <button onclick="startCleanup()" class="bg-blue-600 text-white py-4 rounded-2xl font-black shadow-lg hover:bg-blue-700 active:scale-95">① 分析開始</button>
            <div id="actionBtns" class="hidden grid grid-cols-1 gap-2">
                <button onclick="window.deleteAllDuplicates()" class="bg-rose-500 text-white py-2 rounded-xl font-bold text-xs shadow-sm hover:bg-rose-600">重複を全て一括削除</button>
                <button onclick="window.fixAllKana()" class="bg-emerald-500 text-white py-2 rounded-xl font-bold text-xs shadow-sm hover:bg-emerald-600">英字フリガナを一括修正</button>
            </div>
        </div>
        <div id="status" class="mb-6 font-bold text-blue-600 text-center text-sm"></div>
        <div id="duplicateResult" class="space-y-2 mb-10"></div>
        <div id="alphabetResult" class="space-y-2"></div>
    </div>
    <script type="module">
        import { db } from "./common.js";
        import { collection, getDocs, deleteDoc, doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        
        // 🌟 飾り文字や空白を除去する関数
        const getRealName = (s) => (s||"").toString().replace(/[\s\u3000()（）]/g, '').replace(/株式会社|有限会社|合同会社|（株）|$$株$$/g, '').trim();
        const clean = (s) => (s||"").toString().replace(/[\s\u3000()（）]/g, '').trim();

        window.startCleanup = async () => {
            const status = document.getElementById('status');
            status.innerText = "全2500件を分析中...";
            const snap = await getDocs(collection(db, "customers"));
            const all = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            const groups = new Map();
            const alphabetList = [];

            all.forEach(c => {
                // 1. 重複判定（名前と住所、回数、日付が完全一致）
                const key = `${clean(c.name)}_${clean(c.address)}_${c.visitCount}_${c.lastVisitDate}`;
                if (!groups.has(key)) groups.set(key, []);
                groups.get(key).push(c);

                // 2. 賢い英字判定
                const realName = getRealName(c.name);
                // 社名の「実質的な始まり」が英字である、または社名のどこかに英字が含まれていてフリガナがカタカナのもの
                const hasEnglish = /[A-Za-zＡ-Ｚ]/.test(realName);
                const startsWithEnglish = /^[A-Za-zＡ-Ｚ]/.test(realName);
                const isKana = c.kana && /^[ア-ン]/.test(c.kana);

                if (hasEnglish && isKana) {
                    // 提案するフリガナ：先頭が英字ならその英字、そうでなければ元のカナの先頭
                    const suggested = startsWithEnglish ? realName.match(/[A-Za-zＡ-Ｚ]/)[0].toUpperCase() : c.kana;
                    alphabetList.push({ ...c, suggested });
                }
            });

            let dupHtml = "", alpHtml = "";
            groups.forEach(m => { if(m.length > 1) { 
                dupHtml += `<div class="p-3 bg-rose-50 rounded-xl text-[11px] flex justify-between items-center border border-rose-100"><span><b>${m[0].name}</b> (${m.length-1}件の重複あり)</span><button onclick="window.deleteExtra('${m.slice(1).map(d=>d.id).join(',')}')" class="text-rose-500 font-black">[重複削除]</button></div>`;
            }});
            alphabetList.forEach(c => {
                alpHtml += `<div class="p-3 bg-emerald-50 rounded-xl text-[11px] flex justify-between items-center border border-emerald-100"><span><b>${c.name}</b> (提案: <span class="text-emerald-600 font-black">${c.suggested}</span>)</span><button onclick="window.fixKana('${c.id}','${c.suggested}')" class="text-emerald-600 font-black">[修正実行]</button></div>`;
            });

            document.getElementById('duplicateResult').innerHTML = dupHtml || '<p class="text-xs text-slate-300">重複なし</p>';
            document.getElementById('alphabetResult').innerHTML = alpHtml || '<p class="text-xs text-slate-300">英字候補なし</p>';
            status.innerText = `【結果】重複 ${Array.from(groups.values()).filter(g=>g.length>1).length}件 / 英字候補 ${alphabetList.length}件`;
            document.getElementById('actionBtns').classList.remove('hidden');
        };

        window.deleteExtra = async (ids) => { if(confirm("重複分を削除しますか？")){ for(const id of ids.split(',')) await deleteDoc(doc(db,"customers",id)); alert("削除しました"); window.startCleanup(); }};
        window.deleteAllDuplicates = async () => {
            const btns = document.querySelectorAll('#duplicateResult button');
            if(!confirm(`${btns.length}件の重複をまとめて一掃します。よろしいですか？`)) return;
            for(const b of btns) { const ids = b.getAttribute('onclick').match(/'([^']+)'/)[1]; for(const id of ids.split(',')) await deleteDoc(doc(db,"customers",id)); }
            alert("大掃除が完了しました！"); window.startCleanup();
        };
        window.fixAllKana = async () => {
            const btns = document.querySelectorAll('#alphabetResult button');
            if(!confirm(`${btns.length}件のフリガナを英字に修正しますか？`)) return;
            for(const b of btns) { const m = b.getAttribute('onclick').match(/'([^']+)','([^']+)'/); await updateDoc(doc(db,"customers",m[1]), {kana: m[2]}); }
            alert("フリガナの一括修正が完了しました！"); window.startCleanup();
        };
        window.fixKana = async (id, k) => { await updateDoc(doc(db,"customers",id),{kana:k}); alert("修正完了"); window.startCleanup(); };
    </script>
</body>
</html>
