    <script type="module">
import { db, getDisplayDept, TARGET_DEPTS } from "./common.js";
import { collection, getDocs, getDoc, updateDoc, addDoc, doc, writeBatch, query, where, limit, orderBy, arrayUnion, serverTimestamp } 
    from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        
       const clean = (s) => (s || "").toString().replace(/\s+/g, '');
       const dateToNum = (s) => (s || "").toString().replace(/[-/]/g, '');
        
        const standardizeDate = (s) => {
            if(!s) return "";
            const d = s.replace(/\//g, '-').split('-');
            if(d.length < 3) return s;
            return `${d[0]}-${d[1].padStart(2, '0')}-${d[2].padStart(2, '0')}`;
        };

        let allRecords = [], dailyData = []; 

async function init() {
    try {
        await loadStaffs(); // 名簿読み込み
        const depts = ["社長", "専務", "ケコム部", "関西支店", "関東支店", "中部営業所", "その他の部署"];
        const deptSelect = document.getElementById('staffDeptFilter');
        if (deptSelect) {
            deptSelect.innerHTML = '<option value="ALL">全部署</option>' + 
                depts.map(d => `<option value="${d}">${d}</option>`).join('');
        }
    const rawDate = sessionStorage.getItem('cp_daily_date');
    if (!rawDate) { location.href = 'calendar.html'; return; }
    
    const targetDate = standardizeDate(rawDate); 
    document.getElementById('displayDate').innerText = targetDate.replace(/-/g, '/');

    const [y, m] = targetDate.split('-');
    const cacheKey = `cp_cal_cache_v_ultimate_${y}_${m.padStart(2, '0')}`;
            const cached = sessionStorage.getItem(cacheKey);
            let currentNotis = []; // 🌟 追加：通知データを保持する変数
            
            if (cached) {
                try {
                    const parsed = JSON.parse(cached);
                    allRecords = (parsed.records || []).filter(r => r.id);
                    currentNotis = parsed.notifications || []; // 🌟 キャッシュから取得
                } catch(e) { console.error("Cache Parse Error", e); }
            }
            
            // 🌟 修正：キャッシュがない場合、その「日」のデータだけをピンポイントで取得（激的な省エネ）
            if (allRecords.length === 0) {
                // targetDate は "2024-10-01" 形式なので Firestore の "2024/10/01" に変換
                const dbSearchDate = targetDate.replace(/-/g, '/');
                const q = query(
                    collection(db, "activity_records"), 
                    where("visitDate", "==", dbSearchDate), // その日だけ！
                    limit(200) // 1日の訪問が200件を超えることはまずないのでこれで十分
                );
                const snap = await getDocs(q);
                allRecords = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            }

            dailyData = allRecords.filter(r => {
                const d = r.visitDate ? r.visitDate.toString().replace(/\//g, '-') : "";
                return d.includes(targetDate) || d === targetDate;

            const container = document.getElementById('activityAccordion');

                const commentHtml = (r.comments || []).map(c => `
                    <div class="p-3 bg-white rounded-xl shadow-sm border border-blue-50 text-left mb-2">
                        <div class="flex justify-between items-center mb-1 text-[9px]">

                const targetNum = dateToNum(r.visitDate);
                const noti = currentNotis.find(n => clean(n.visitorName) === clean(r.visitorName) && dateToNum(n.visitDate) === targetNum && clean(n.customerName) === clean(r.customerName));

                return `

                            <span class="bg-white/20 px-3 py-1 rounded text-[10px] font-black">${r.startTime || '--:--'}</span>

                            <span class="text-base font-black tracking-tight">${r.visitorName} <i class="fa-solid fa-caret-right mx-2 opacity-50"></i> ${r.customerName}</span>

                    <div class="accordion-content">

                            ${(isRead && noti) ? `<button onclick="window.toggleReadStatus('${r.visitorName}', '${r.customerName}', '${r.visitDate}', true, false, 'acc-${i}')" class="px-5 py-1.5 rounded-full font-black text-[10px] transition-all border shadow-sm flex items-center gap-2 bg-orange-50 text-orange-600 border-orange-200 hover:bg-orange-600 hover:text-white"><i class="fa-solid fa-envelope"></i><span>未読に戻す</span></button>` : ''}
                        </div>
                        
                        <div class="info-grid">
                            <div><p class="info-label">訪問内容</p><p class="info-value text-[#ff7e11] font-black">${r.activityType || '営業'}</p></div>
                            <div><p class="info-label">お客様担当者</p><p class="info-value">${r.customerStaffName || r.customerStaff || '-'}</p></div>
                            <div><p class="info-label">訪問時間</p><p class="info-value text-blue-600"><i class="fa-regular fa-clock mr-1"></i> ${r.startTime} 〜 ${r.endTime}</p></div>
                            <div><p class="info-label">顧客情報</p><p class="info-value"><span class="bg-slate-700 text-white px-2 py-0.5 rounded text-[9px] mr-1">${r.customerRank || '--'}</span><span class="text-orange-600">${r.customerAttr || '--'}</span></p></div>
                            <div><p class="info-label">所属部署</p><p class="info-value text-[11px] uppercase font-bold">${getDisplayDept(r.visitorDept)}</p></div>
                            <div><p class="info-label">同行者</p><p class="info-value">${r.companion || 'なし'}</p></div>
                        </div>

<div class="flex justify-between items-center mb-6 bg-slate-50 p-4 rounded-xl border border-slate-100">
    <div class="text-[10px] font-bold text-slate-400">
        <i class="fa-solid fa-fingerprint mr-1"></i> ID: ${r.id}
    </div>
    <div class="flex gap-2">
        <!-- 🌟 複写ボタンを追加 -->
        <button onclick="location.href='history.html?copyId=${r.id}'" class="px-4 py-2 bg-emerald-50 text-emerald-600 border border-emerald-200 rounded-lg font-black text-xs hover:bg-emerald-600 hover:text-white transition-all flex items-center gap-2 shadow-sm">
            <i class="fa-solid fa-copy"></i> 複写
        </button>
        <button onclick="location.href='history.html?editId=${r.id}'" class="px-6 py-2 bg-white text-blue-600 border border-blue-200 rounded-lg font-black text-xs hover:bg-blue-600 hover:text-white hover:border-blue-600 transition-all flex items-center gap-2 shadow-sm">
            <i class="fa-solid fa-pen-to-square"></i> 修正・削除
        </button>
    </div>
</div>
                        <div class="mb-8">
                            <p class="info-label mb-2">定性データ分析</p>
                            <div class="flex flex-wrap gap-2">
                                ${r.qualData1 ? `<span class="bg-blue-50 text-blue-600 px-2 py-1 rounded text-[10px] font-black border border-blue-100">${r.qualData1}</span>` : ''}
                                ${r.qualData2 ? `<span class="bg-orange-50 text-orange-600 px-2 py-1 rounded text-[10px] font-black border border-orange-100">${r.qualData2}</span>` : ''}
                                ${r.qualData3 ? `<span class="bg-emerald-50 text-emerald-600 px-2 py-1 rounded text-[10px] font-black border border-emerald-100">${r.qualData3}</span>` : ''}
                                ${r.qualFree ? `<span class="bg-slate-100 text-slate-600 px-2 py-1 rounded text-[10px] font-black border border-slate-200">${r.qualFree}</span>` : ''}
                            </div>
                        </div>

                        <p class="info-label mb-2 tracking-widest uppercase">■ お客様からの情報</p>
                        <div class="report-box whitespace-pre-wrap text-slate-700 mb-6">${r.content || '報告なし'}</div>
                        <p class="info-label mb-2 tracking-widest uppercase">■ 自分・スタッフの考え</p>
                        <div class="report-box border-l-4 border-orange-200 bg-orange-50/30 whitespace-pre-wrap text-slate-600 mb-6">${r.staffThoughts || '未入力'}</div>
                        ${thumbs ? `<div class="mt-6 flex flex-wrap gap-2 mb-6">${thumbs}</div>` : ''}
                        
                        <div class="mt-4 flex justify-end mb-8">
                            <div class="bg-blue-600 text-white px-5 py-2 rounded-xl text-[10px] font-black shadow-md">次回訪問予定日：${r.nextVisitDate || '--/--/--'}</div>
                        </div>

                <div class="mt-8 p-6 bg-blue-50/50 rounded-2xl border border-blue-100 shadow-inner">
                    <p class="text-[9px] font-black text-blue-400 uppercase tracking-widest mb-4 flex items-center gap-2">
                        <i class="fa-solid fa-comment-dots text-sm"></i> 指導・確認コメント
                    </p>
                    <div class="space-y-3 mb-5">
                        ${(r.comments || []).map((c, idx) => `
                            <div class="p-3 bg-white rounded-xl shadow-sm border border-blue-50 text-left relative">
                                <div class="flex justify-between items-center mb-1">
                                    <div class="flex items-center gap-2">
                                        <!-- 🌟 日付を左端へ -->
                                        <span class="text-[9px] font-bold text-slate-400 font-mono">${c.date}</span>
                                        <span class="text-[10px] font-black px-2 py-0.5 bg-blue-50 text-blue-600 rounded-full">${c.sender} ➔ ${c.receiver}</span>
                                    </div>
                                    <!-- 🌟 ✕ボタン（自分のコメントのみ） -->
                                    ${c.sender === sessionStorage.getItem('userName') ? `
                                        <button onclick="window.deleteComment('${r.id}', ${idx})" class="text-rose-400 hover:text-rose-600 font-black text-sm p-1">✕</button>
                                    ` : ''}
                                </div>
                                <p class="text-xs font-bold text-slate-700 leading-relaxed">${c.text}</p>
                            </div>
                        `).join('')}
                    </div>
                    <div class="space-y-3 text-left">
                        <textarea id="cmt-text-${i}" class="w-full p-3 text-xs font-bold rounded-xl border border-slate-200 outline-none focus:ring-2 focus:ring-blue-400 min-h-[80px]" placeholder="コメントを入力..."></textarea>
                        <div class="flex justify-between items-center gap-4">
                            <div class="flex items-center gap-2 flex-1">
                                <span class="text-[9px] font-black text-slate-400">宛先:</span>
                                <!-- 🌟 修正：名簿を呼び出すボタン -->
                                <div id="cmt-to-display-${i}" class="flex-1 p-2 bg-white border border-slate-200 rounded-lg text-[10px] font-black min-h-[34px] cursor-pointer hover:bg-slate-50 transition-all flex items-center" 
                                     onclick="window.openStaffModal(${i}, '${r.visitorName}')">
                                    ${r.visitorName}
                            </div> <!-- 227行目の cmt-to-display を閉じる -->
                        </div> <!-- 224行目の flex items-center を閉じる -->
                        <button onclick="window.postComment('${r.id}', '${r.customerName}', ${i}, '${r.visitDate}')" class="px-8 py-2.5 bg-[#004098] text-white rounded-xl text-[10px] font-black shadow-lg active:scale-95">送信</button>
                    </div> <!-- 223行目の flex justify-between を閉じる -->
                </div> <!-- 221行目の space-y-3 を閉じる -->
            </div> <!-- 185行目の mt-8 p-6 (コメントエリア全体) を閉じる -->
        </div> <!-- 150行目の accordion-content を閉じる -->
    </div> <!-- 113行目の accordion-item を閉じる -->`;
}).join('') : '<div class="py-20 text-center text-slate-300 font-black italic uppercase tracking-widest">No Activity Today</div>';

            autoFocus(); 
        } catch (e) { console.error("Init Error:", e); }
    }
    
function autoFocus() {
    const targetId = sessionStorage.getItem('cp_auto_open_recordId');
    if (targetId) {
        const items = document.querySelectorAll('.accordion-item');
        items.forEach(item => {
            if (item.innerHTML.includes(targetId)) {
                const content = item.querySelector('.accordion-content');
                if (content) content.style.display = 'block';
                const chevron = item.querySelector('.fa-chevron-down');
                if (chevron) chevron.style.transform = 'rotate(180deg)';
                item.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        });
        sessionStorage.removeItem('cp_auto_open_recordId');
        return;
    }
   
    const targetName = sessionStorage.getItem('cp_usage_jump_name');
    const targetCust = sessionStorage.getItem('cp_usage_jump_customer');
    if (!targetName || !targetCust) return;

    const items = document.querySelectorAll('.accordion-item');
    items.forEach(item => {
        const headerText = item.querySelector('.accordion-header').innerText;
        if (headerText.includes(targetName) && headerText.includes(targetCust)) {
            window.toggleAcc(item.id);
            item.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
    });
    sessionStorage.removeItem('cp_usage_jump_name');
    sessionStorage.removeItem('cp_usage_jump_customer');
}        

window.toggleAcc = async (id, visitorName, customerName, date) => {
    const item = document.getElementById(id);
    const content = item.querySelector('.accordion-content');
    const open = content.style.display === 'block';
    content.style.display = open ? 'none' : 'block';
    const chevron = item.querySelector('.fa-chevron-down');
    if(chevron) chevron.style.transform = open ? 'rotate(0deg)' : 'rotate(180deg)';

    // 🌟 デイリーレポート用の自動既読ロジック
    const badge = item.querySelector('.bg-orange-500');
    if (!open && badge && badge.innerText.includes("未読")) {
        // 未読(false)を既読にするため auto=true で呼び出し
        window.toggleReadStatus(visitorName, customerName, date, false, true, id); 
    }
};
        // 270行目付近の関数定義を以下に修正
window.toggleAcc = async (id, visitorName, customerName, date) => {
    const item = document.getElementById(id);
    const content = item.querySelector('.accordion-content');
    const open = (content.style.display === 'block');
    
    content.style.display = open ? 'none' : 'block';
    const chevron = item.querySelector('.fa-chevron-down');
    if(chevron) chevron.style.transform = open ? 'rotate(0deg)' : 'rotate(180deg)';

    // 未読(false)を既読(true)にするための判定
    const badge = item.querySelector('.bg-orange-500');
    // アコーディオンを開いた(openがfalseからtrueになる)時に実行
    if (!open && badge && badge.innerText.includes("未読")) {
        window.toggleReadStatus(visitorName, customerName, date, false, true, id); 
    }
};
        
window.toggleReadStatus = async (visitorName, customerName, date, currentStatus, auto = false, autoOpenId = null) => {
    // 1. 手動の時だけ確認を出す（お作法）
    if (auto === false && !confirm(currentStatus ? "未読に戻しますか？" : "既読にしますか？")) return;
    
    try {
        const myName = sessionStorage.getItem('userName');
        const targetDate = date.replace(/-/g, '/');
        
        // 2. 通信を最小限に（1件だけ取得）
        const q = query(collection(db, "notifications"), 
                        where("recipient", "==", myName),
                        where("visitorName", "==", visitorName),
                        where("customerName", "==", customerName),
                        where("visitDate", "==", targetDate),
                        limit(1));
        
        const snap = await getDocs(q);
        if (!snap.empty) {
            // Firestoreを更新（Read 1回 / Write 1回）
            await updateDoc(snap.docs[0].ref, { isRead: !currentStatus });

            // 3. 🌟 カレンダー・サイドバー連動の要（キャッシュの狙い撃ち更新）
            const [y, m] = date.split(/[-/]/);
            const cacheKey = `cp_cal_cache_v_ultimate_${y}_${m.padStart(2, '0')}`;
            const cached = JSON.parse(sessionStorage.getItem(cacheKey) || '{}');
            
            if (cached.notifications) {
                const targetIdx = cached.notifications.findIndex(n => 
                    clean(n.visitorName) === clean(visitorName) && 
                    dateToNum(n.visitDate) === dateToNum(date) && 
                    clean(n.customerName) === clean(customerName)
                );
                if (targetIdx !== -1) {
                    // キャッシュ内の未読状態を直接書き換え
                    cached.notifications[targetIdx].isRead = !currentStatus;
                    sessionStorage.setItem(cacheKey, JSON.stringify(cached));
                }
            }

            // 4. 爆速リロードと位置保持
            if(autoOpenId) sessionStorage.setItem('cp_auto_open_id', autoOpenId);
            location.reload(); 
        }
    } catch (e) { console.error("Toggle Error:", e); }
};
        let allStaffs = [], modalSelected = [], currentActiveIdx = null;
        async function loadStaffs() {
            const KEY = 'cp_staffs_cache';
            const cached = sessionStorage.getItem(KEY);
            if (cached) { allStaffs = JSON.parse(cached); return; }
            const snap = await getDocs(query(collection(db, "staffs"), orderBy("name")));
            allStaffs = snap.docs.map(d => d.data());
            sessionStorage.setItem(KEY, JSON.stringify(allStaffs));
        }

        window.openStaffModal = (idx, defaultName) => {
            currentActiveIdx = idx;
            document.getElementById('staffModal').style.display = 'flex';
            const curVal = document.getElementById(`cmt-to-display-${idx}`).innerText;
            modalSelected = (curVal && curVal !== '選択してください') ? curVal.split(', ') : [defaultName];
            window.renderStaffList();
        };
        window.closeModal = () => document.getElementById('staffModal').style.display = 'none';
        window.renderStaffList = () => {
            const kw = document.getElementById('staffKeyword').value.toLowerCase();
            const dp = document.getElementById('staffDeptFilter').value;
            const mainDepts = ["社長", "専務", "ケコム部", "関西支店", "関東支店", "中部営業所"];
            const filtered = allStaffs.filter(s => {
                const matchKw = !kw || s.name.includes(kw);
                let matchDept = (dp === 'ALL') ? true : (dp === 'その他の部署' ? !mainDepts.includes(s.dept) : s.dept === dp);
                return matchKw && matchDept;
            });
            document.getElementById('staffList').innerHTML = filtered.map(s =>
                `<div class="p-3 border-b flex justify-between cursor-pointer ${modalSelected.includes(s.name) ? 'bg-blue-50 text-blue-700 font-bold' : ''}" onclick="window.toggleStaffSelection('${s.name}')"><span>${s.name}</span><span class="text-[9px] opacity-40">${s.dept || ''}</span></div>`).join('');
        };
        window.toggleStaffSelection = (name) => {
            if (modalSelected.includes(name)) modalSelected = modalSelected.filter(n => n !== name);
            else modalSelected.push(name); window.renderStaffList();
        };
        window.clearModalSelection = () => { modalSelected = []; window.renderStaffList(); };
        window.applySelection = () => {
            document.getElementById(`cmt-to-display-${currentActiveIdx}`).innerText = modalSelected.join(', ') || '選択してください';
            window.closeModal();
        };

window.postComment = async (recordId, customerName, index, visitDate) => {
    const text = document.getElementById(`cmt-text-${index}`).value.trim();
    const receiverRaw = document.getElementById(`cmt-to-display-${index}`).innerText;
    const sender = sessionStorage.getItem('userName') || "管理者";
    const fDate = visitDate.replace(/-/g, '/');

    if (!text || receiverRaw === '選択してください') return alert("内容を入力してください");

    try {
        const now = new Date();
        const dateStr = `${now.getMonth()+1}/${now.getDate()} ${now.getHours()}:${String(now.getMinutes()).padStart(2,'0')}`;
        
        // 1. 実績本体にコメントを追加（上書き更新）
        const docRef = doc(db, "activity_records", recordId);
        await updateDoc(docRef, { 
            comments: arrayUnion({ sender, receiver: receiverRaw, text, date: dateStr }) 
        });

        // 2. 通知のUpsert（Read 0の直接書き込み）
        const targetRecipients = receiverRaw.split(', ').map(n => n.trim()).filter(name => name !== sender);
        const batch = writeBatch(db);
        
        for (const recipient of targetRecipients) {
            // IDを「受信者_顧客_日付」で固定して名寄せ
            const customNotiId = `noti_${clean(recipient)}_${clean(customerName)}_${clean(fDate)}`;
            const notiRef = doc(db, "notifications", customNotiId);
            
            batch.set(notiRef, {
                recipient: recipient,
                visitorName: dailyData[index].visitorName, // 元の訪問者
                customerName: customerName,
                visitDate: fDate, 
                type: "コメント入電",
                isRead: false,
                createdAt: serverTimestamp()
            }, { merge: true });
        }
        await batch.commit();

        // 自身のキャッシュを削除してリフレッシュ
        const [y, m] = visitDate.split(/[-/]/);
        sessionStorage.removeItem(`cp_cal_cache_v_ultimate_${y}_${m.padStart(2, '0')}`);
        sessionStorage.setItem('cp_auto_open_recordId', recordId); 

        alert("送信しました");
        location.reload();
    } catch (e) { alert("送信エラー: " + e.message); }
};

window.deleteComment = async (recordId, commentIdx) => {
    if (!confirm("自分のコメントを取り消しますか？")) return;
    try {
        const ref = doc(db, "activity_records", recordId);
        const docSnap = await getDoc(ref);
        if (docSnap.exists()) {
            const data = docSnap.data();
            let comments = data.comments || [];
            comments.splice(parseInt(commentIdx), 1);
            await updateDoc(ref, { comments: comments });

            // 🌟 修正：キャッシュを削除して、リロード後に最新状態を表示させる
            if (data.visitDate) {
                const [y, m] = data.visitDate.split(/[-/]/);
                sessionStorage.removeItem(`cp_cal_cache_v_ultimate_${y}_${m.padStart(2, '0')}`);
            }

            alert("コメントを削除しました");
            // 🌟 IDを保存（autoFocusでこれを使って開く）
            sessionStorage.setItem('cp_auto_open_recordId', recordId);
            location.reload(); 
        }
    } catch (e) { alert("削除エラー: " + e.message); }
};
        init();
    </script>
      <!-- スタッフモーダル（見た目の部分） -->
    <div id="staffModal" class="modal-overlay" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 100; backdrop-filter: blur(8px); align-items: center; justify-content: center; padding: 1rem;">
        <div class="modal-content" style="background: white; width: 100%; max-width: 450px; border-radius: 1.5rem; overflow: hidden;">
            <div class="bg-slate-900 p-4 text-white flex justify-between items-center">
                <span class="font-black text-xs uppercase tracking-widest">宛先を選択</span>
                <i class="fa-solid fa-xmark cursor-pointer" onclick="window.closeModal()"></i>
            </div>
            <div class="p-4 bg-slate-50 border-b border-slate-100">
                <div class="grid grid-cols-2 gap-2 mb-2">
                    <input type="text" id="staffKeyword" oninput="window.renderStaffList()" placeholder="氏名検索..." class="p-2.5 rounded-lg border border-slate-200 text-xs font-bold outline-none">
                    <select id="staffDeptFilter" onchange="window.renderStaffList()" class="p-2.5 rounded-lg border border-slate-200 text-xs font-bold outline-none"><option value="ALL">全部署</option></select>
                </div>
            </div>
            <div id="staffList" class="overflow-y-auto custom-scrollbar" style="height: 350px;"></div>
            <div class="p-4 bg-slate-50 grid grid-cols-3 gap-2 border-t border-slate-100">
                <button onclick="window.applySelection()" class="col-span-2 py-3 bg-[#004098] text-white rounded-xl font-black text-sm shadow-lg active:scale-95">決定</button>
                <button onclick="window.clearModalSelection()" class="py-3 bg-white border border-slate-200 text-slate-400 rounded-xl font-bold text-sm hover:bg-slate-100 transition-all">クリア</button>
            </div>
        </div>
    </div>
