<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8"><title>デイリーレポート | CP My Page</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --copros-blue: #87ceeb; --copros-orange: #ff7e11; --copros-navy: #004098; }
        body { font-family: "Hiragino Kaku Gothic ProN", Meiryo, sans-serif; background-color: #f1f5f9; }
        .accordion-item { background: white; border-radius: 1rem; border: 1px solid #e2e8f0; overflow: hidden; margin-bottom: 1rem; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.05); }
        .accordion-header { padding: 1.2rem 2rem; cursor: pointer; display: flex; align-items: center; justify-content: space-between; background: #3c4b5a; color: white; }
        .accordion-content { display: none; padding: 2rem; background: white; border-top: 1px solid #f1f5f9; }
        .info-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1.5rem; border-bottom: 1px solid #f1f5f9; padding-bottom: 1.5rem; margin-bottom: 1.5rem; }
        .info-label { font-size: 10px; font-weight: 800; color: #94a3b8; margin-bottom: 4px; }
        .info-value { font-size: 13px; font-weight: 800; color: #475569; }
        .report-box { background: #f8fafc; border-radius: 1rem; padding: 1.5rem; border: 1px solid #f1f5f9; font-size: 13px; line-height: 1.7; margin-bottom: 1.5rem; }
        .summary-card { background: linear-gradient(135deg, #004098 0%, #2d3748 100%); color: white; border-radius: 1.5rem; padding: 1.5rem; margin-bottom: 2rem; display: flex; align-items: center; justify-content: center; gap: 6rem; box-shadow: 0 10px 25px -5px rgba(0,64,152,0.3); }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="flex h-screen overflow-hidden text-slate-700 font-sans">
    <div id="sidebar-placeholder"></div>
    <main class="flex-1 flex flex-col overflow-hidden">
        <div id="header-placeholder"></div>
        <div class="flex-1 overflow-auto p-4 lg:p-8 custom-scrollbar">
            <div class="max-w-[1200px] mx-auto">
                <div class="flex justify-between items-end mb-8">
                    <div>
                        <h1 class="text-4xl font-black text-slate-800 tracking-tighter">デイリーレポート</h1>
                        <nav class="text-[10px] font-black text-slate-400 uppercase tracking-widest italic mb-2">Daily Team Activity Overview</nav>
                        <p id="displayDate" class="text-xl font-black text-orange-500 border-l-4 border-orange-500 pl-4 mt-4">----/--/--</p>
                    </div>
                    <button onclick="location.href='calendar.html'" class="px-6 py-2 bg-white border border-slate-200 rounded-xl font-black text-xs shadow-sm hover:bg-slate-50 transition-all">カレンダーへ戻る</button>
                </div>

                <div class="summary-card">
                    <div class="text-center"><p class="text-[10px] opacity-60 font-black uppercase mb-1 tracking-widest">本日の営業件数</p><p class="text-3xl lg:text-4xl font-black"><span id="sumVisits">0</span><span class="text-sm ml-1">件</span></p></div>
                    <div class="w-px h-12 bg-white/10 hidden md:block"></div>
                    <div class="text-center"><p class="text-[10px] opacity-60 font-black uppercase mb-1 tracking-widest">活動メンバー</p><p class="text-3xl lg:text-4xl font-black"><span id="sumStaff">0</span><span class="text-sm ml-1">名</span></p></div>
                </div>

                <div id="activityAccordion" class="space-y-4 mb-20">
                    <!-- 読み込み中表示（一瞬で消えるはずです） -->
                    <div class="py-20 text-center text-slate-300 font-bold italic animate-pulse">同期中...</div>
                </div>
            </div>
        </div>
    </main>

    <script type="module" src="common.js"></script>
    <script type="module">
        import { db } from "./common.js";
        import { collection, getDocs, query, where, limit, doc, updateDoc, addDoc, serverTimestamp, arrayUnion } 
            from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        
       const clean = (s) => (s || "").toString().replace(/\s+/g, '');
       const dateToNum = (s) => (s || "").toString().replace(/[-/]/g, '');
        
        const standardizeDate = (s) => {
            if(!s) return "";
            const d = s.replace(/\//g, '-').split('-');
            if(d.length < 3) return s;
            return `${d[0]}-${d[1].padStart(2, '0')}-${d[2].padStart(2, '0')}`;
        };

        let allRecords = [], dailyData = []; 

async function init() {
    const rawDate = sessionStorage.getItem('cp_daily_date');
    if (!rawDate) { location.href = 'calendar.html'; return; }
    
    const targetDate = standardizeDate(rawDate); 
    document.getElementById('displayDate').innerText = targetDate.replace(/-/g, '/');

    const [y, m] = targetDate.split('-');
    const cacheKey = `cp_cal_cache_v_ultimate_${y}_${m.padStart(2, '0')}`;
            const cached = sessionStorage.getItem(cacheKey);
            let currentNotis = []; // 🌟 追加：通知データを保持する変数
            
            if (cached) {
                try {
                    const parsed = JSON.parse(cached);
                    allRecords = (parsed.records || []).filter(r => r.id);
                    currentNotis = parsed.notifications || []; // 🌟 キャッシュから取得
                } catch(e) { console.error("Cache Parse Error", e); }
            }
            
            if (allRecords.length === 0) {
                const q = query(
                    collection(db, "activity_records"), 
                    where("visitDate", ">=", `${y}/${m.padStart(2, '0')}/01`), 
                    where("visitDate", "<=", `${y}/${m.padStart(2, '0')}/31`),
                    limit(500)
                );
                const snap = await getDocs(q);
                allRecords = snap.docs.map(d => ({ id: d.id, ...d.data() }));
            }

            dailyData = allRecords.filter(r => {
                const d = r.visitDate ? r.visitDate.toString().replace(/\//g, '-') : "";
                return d.includes(targetDate) || d === targetDate;
            }).sort((a,b) => (a.startTime || "00:00").localeCompare(b.startTime || "00:00"));
            
            document.getElementById('sumVisits').innerText = dailyData.length;
            document.getElementById('sumStaff').innerText = [...new Set(dailyData.map(d => d.visitorName))].length;

            const container = document.getElementById('activityAccordion');

            container.innerHTML = dailyData.length ? dailyData.map((r, i) => {
                const images = (r.attachments || []).map(f => ({ src: f.base64 || f.url, name: f.name }));
                const typeLabels = { '営業': '営', 'リモート営業': 'リモ', '打合せ(受注後)': '打', '施工': '施', '定期訪問': '定', '電話応対': '電', '来訪対応': '来', '業務日報': '日', 'メディア収集': 'メ', '差別化プレゼンチラシ': '差' };
                const shortType = typeLabels[r.activityType] || '営';
                const thumbs = images.map(img => `<div class="w-20 h-20 rounded-xl overflow-hidden border border-slate-200 shadow-sm bg-slate-100"><img src="${img.src}" class="w-full h-full object-cover" loading="lazy"></div>`).join('');
                
                // コメント送信先リストの作成
                const commentators = (r.comments || []).map(c => c.sender);
                const toOptions = [...new Set([r.visitorName, ...commentators])];
                const optionHtml = toOptions.map(name => `<option value="${name}">${name}</option>`).join('') + `<option value="全員">全員</option>`;
                
                // コメント履歴HTMLの作成
                const commentHtml = (r.comments || []).map(c => `<div class="p-3 bg-white rounded-xl shadow-sm border border-blue-50 text-xs font-bold text-slate-700">${c.text}</div>`).join('');

                const targetNum = dateToNum(r.visitDate);
                const noti = currentNotis.find(n => clean(n.visitorName) === clean(r.visitorName) && dateToNum(n.visitDate) === targetNum && clean(n.customerName) === clean(r.customerName));
                const isRead = noti ? noti.isRead : true;

                return `
                <div class="accordion-item" id="acc-${i}">
                    <div class="accordion-header" onclick="window.toggleAcc('acc-${i}', '${r.visitorName}', '${r.customerName}', '${r.visitDate}')">
                        <div class="flex items-center gap-4">
                            <span class="status-badge text-[9px] font-black px-2 py-0.5 rounded-md ${isRead ? 'bg-slate-500/30 text-white/50' : 'bg-orange-500 text-white animate-pulse'}">${isRead ? '既読' : '未読'}</span>
                            <span class="bg-white/20 px-3 py-1 rounded text-[10px] font-black">${r.startTime || '--:--'}</span>
                            <span class="text-[10px] font-black bg-white/10 px-2 py-0.5 rounded-md opacity-70">[${shortType}]</span>
                            <span class="text-base font-black tracking-tight">${r.visitorName} <i class="fa-solid fa-caret-right mx-2 opacity-50"></i> ${r.customerName}</span>
                        </div>
                        <i class="fa-solid fa-chevron-down opacity-30 text-xs transition-transform"></i>
                    </div>

                    <div class="accordion-content">
                        <div class="flex justify-end mb-4">
                            ${(isRead && noti) ? `<button onclick="window.toggleReadStatus('${r.visitorName}', '${r.customerName}', '${r.visitDate}', true, false, 'acc-${i}')" class="px-5 py-1.5 rounded-full font-black text-[10px] transition-all border shadow-sm flex items-center gap-2 bg-orange-50 text-orange-600 border-orange-200 hover:bg-orange-600 hover:text-white"><i class="fa-solid fa-envelope"></i><span>未読に戻す</span></button>` : ''}
                        </div>
                        
                        <div class="info-grid">
                            <div><p class="info-label">訪問内容</p><p class="info-value text-[#ff7e11] font-black">${r.activityType || '営業'}</p></div>
                            <div><p class="info-label">お客様担当者</p><p class="info-value">${r.customerStaffName || r.customerStaff || '-'}</p></div>
                            <div><p class="info-label">訪問時間</p><p class="info-value text-blue-600"><i class="fa-regular fa-clock mr-1"></i> ${r.startTime} 〜 ${r.endTime}</p></div>
                            <div><p class="info-label">顧客情報</p><p class="info-value"><span class="bg-slate-700 text-white px-2 py-0.5 rounded text-[9px] mr-1">${r.customerRank || '--'}</span><span class="text-orange-600">${r.customerAttr || '--'}</span></p></div>
                            <div><p class="info-label">所属部署</p><p class="info-value text-[11px] uppercase font-bold">${r.visitorDept || '-'}</p></div>
                            <div><p class="info-label">同行者</p><p class="info-value">${r.companion || 'なし'}</p></div>
                        </div>

                        <div class="mb-8">
                            <p class="info-label mb-2">定性データ分析</p>
                            <div class="flex flex-wrap gap-2">
                                ${r.qualData1 ? `<span class="bg-blue-50 text-blue-600 px-2 py-1 rounded text-[10px] font-black border border-blue-100">${r.qualData1}</span>` : ''}
                                ${r.qualData2 ? `<span class="bg-orange-50 text-orange-600 px-2 py-1 rounded text-[10px] font-black border border-orange-100">${r.qualData2}</span>` : ''}
                                ${r.qualData3 ? `<span class="bg-emerald-50 text-emerald-600 px-2 py-1 rounded text-[10px] font-black border border-emerald-100">${r.qualData3}</span>` : ''}
                                ${r.qualFree ? `<span class="bg-slate-100 text-slate-600 px-2 py-1 rounded text-[10px] font-black border border-slate-200">${r.qualFree}</span>` : ''}
                            </div>
                        </div>

                        <p class="info-label mb-2 tracking-widest uppercase">■ お客様からの情報</p>
                        <div class="report-box whitespace-pre-wrap text-slate-700 mb-6">${r.content || '報告なし'}</div>
                        <p class="info-label mb-2 tracking-widest uppercase">■ 自分・スタッフの考え</p>
                        <div class="report-box border-l-4 border-orange-200 bg-orange-50/30 whitespace-pre-wrap text-slate-600 mb-6">${r.staffThoughts || '未入力'}</div>
                        ${thumbs ? `<div class="mt-6 flex flex-wrap gap-2 mb-6">${thumbs}</div>` : ''}
                        
                        <div class="mt-4 flex justify-end mb-8">
                            <div class="bg-blue-600 text-white px-5 py-2 rounded-xl text-[10px] font-black shadow-md">次回訪問予定日：${r.nextVisitDate || '--/--/--'}</div>
                        </div>

                        <div class="mt-8 p-6 bg-blue-50/50 rounded-2xl border border-blue-100">
                            <p class="text-[9px] font-black text-blue-400 uppercase tracking-widest mb-4 flex items-center gap-2"><i class="fa-solid fa-comment-dots"></i> 指導・確認コメント</p>
                            <div class="space-y-3 mb-5">${commentHtml}</div>
                            <div class="space-y-3">
                                <textarea id="cmt-text-${i}" class="w-full p-3 text-xs font-bold rounded-xl border border-slate-200 min-h-[80px]" placeholder="コメント..."></textarea>
                                <div class="flex justify-between items-center gap-4">
                                    <select id="cmt-to-${i}" class="flex-1 text-[10px] font-bold p-2 rounded-lg border border-slate-200 bg-white">${optionHtml}</select>
                                    <button onclick="window.postComment('${r.id}', '${r.customerName}', ${i})" class="px-6 py-2 bg-[#004098] text-white rounded-xl text-[10px] font-black shadow-md">送信</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>`;
            }).join('') : '<div class="py-20 text-center text-slate-300 font-black italic uppercase tracking-widest">No Activity Today</div>';

            autoFocus(); 
        } catch (e) { console.error("Init Error:", e); }
    }
    
window.postComment = async (recordId, customerName, index) => {
    const text = document.getElementById(`cmt-text-${index}`).value.trim();
    const receiver = document.getElementById(`cmt-to-${index}`).value;
    const sender = sessionStorage.getItem('userName') || "管理者";
    
    // 🌟 追加：カレンダーとの連動に必要な日付を取得
    const rawDate = sessionStorage.getItem('cp_daily_date');
    const formattedDate = standardizeDate(rawDate).replace(/-/g, '/');

    if (!text) return alert("コメントを入力してください");

    try {
        const ref = doc(db, "activity_records", recordId);
        const now = new Date();
        const dateStr = `${now.getMonth()+1}/${now.getDate()} ${now.getHours()}:${String(now.getMinutes()).padStart(2,'0')}`;
        
        await updateDoc(ref, { comments: arrayUnion({ sender, receiver, text, date: dateStr }) });
        const recordData = dailyData[index];
        if (receiver === "全員") {
            const circularList = recordData.circularNames || [];
            const visitorName = recordData.visitorName;
            let targets = [...new Set([...circularList, visitorName])];
            targets = targets.filter(name => name !== sender);

            await Promise.all(targets.map(name => 
                addDoc(collection(db, "notifications"), {
                    recipient: name, // 🌟 ループ内の name を指定！
                    visitorName: recordData.visitorName,
                    customerName: customerName,
                    visitDate: formattedDate,
                    type: "コメント入電",
                    isRead: false,
                    createdAt: serverTimestamp()
                })
            ));
        } else {
            if (receiver !== sender) {
                await addDoc(collection(db, "notifications"), {
                    recipient: receiver,
                    visitorName: recordData.visitorName, // 送信者ではなく「誰の訪問か」を入れる
                    customerName: customerName,
                    visitDate: formattedDate, // 🌟 これがバッジ点灯に必須
                    type: "コメント入電",
                    isRead: false,
                    createdAt: serverTimestamp()
                });
            }
        }
        
        alert("コメントを送信しました");
        // 🌟 親切設計：今送信したアコーディオンのIDを一時保存
        sessionStorage.setItem('cp_auto_open_id', `acc-${index}`);

        const rawDate = sessionStorage.getItem('cp_daily_date');
        const [y, m] = rawDate.split(/[-/]/);
        sessionStorage.removeItem(`cp_cal_cache_v_ultimate_${y}_${m.padStart(2, '0')}`);
        location.reload(); // リロード
    } catch (e) { alert("送信エラー: " + e.message); }
};

function autoFocus() {
    // 🌟 追加：コメント送信直後の自動展開
    const autoOpenId = sessionStorage.getItem('cp_auto_open_id');
    if (autoOpenId) {
        window.toggleAcc(autoOpenId);
        document.getElementById(autoOpenId)?.scrollIntoView({ behavior: 'smooth', block: 'center' });
        sessionStorage.removeItem('cp_auto_open_id');
        return; // 他のジャンプ処理と競合しないよう終了
    }
    const targetName = sessionStorage.getItem('cp_usage_jump_name');
    const targetCust = sessionStorage.getItem('cp_usage_jump_customer');
    if (!targetName || !targetCust) return;

    const items = document.querySelectorAll('.accordion-item');
    items.forEach(item => {
        const headerText = item.querySelector('.accordion-header').innerText;
        if (headerText.includes(targetName) && headerText.includes(targetCust)) {
            window.toggleAcc(item.id);
            item.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
    });
    sessionStorage.removeItem('cp_usage_jump_name');
    sessionStorage.removeItem('cp_usage_jump_customer');
}        

window.toggleAcc = async (id, visitorName, customerName, date) => {
    const item = document.getElementById(id);
    const content = item.querySelector('.accordion-content');
    const open = content.style.display === 'block';
    content.style.display = open ? 'none' : 'block';
    const chevron = item.querySelector('.fa-chevron-down');
    if(chevron) chevron.style.transform = open ? 'rotate(0deg)' : 'rotate(180deg)';

    // 🌟 デイリーレポート用の自動既読ロジック
    const badge = item.querySelector('.bg-orange-500');
    if (!open && badge && badge.innerText.includes("未読")) {
        // 未読(false)を既読にするため auto=true で呼び出し
        window.toggleReadStatus(visitorName, customerName, date, false, true, id); 
    }
};
        
window.toggleReadStatus = async (visitorName, customerName, date, currentStatus, auto = false, autoOpenId = null) => {
    // 1. 手動の時だけ確認を出す（お作法）
    if (auto === false && !confirm(currentStatus ? "未読に戻しますか？" : "既読にしますか？")) return;
    
    try {
        const myName = sessionStorage.getItem('userName');
        const targetDate = date.replace(/-/g, '/');
        
        // 2. 通信を最小限に（1件だけ取得）
        const q = query(collection(db, "notifications"), 
                        where("recipient", "==", myName),
                        where("visitorName", "==", visitorName),
                        where("customerName", "==", customerName),
                        where("visitDate", "==", targetDate),
                        limit(1));
        
        const snap = await getDocs(q);
        if (!snap.empty) {
            // Firestoreを更新（Read 1回 / Write 1回）
            await updateDoc(snap.docs[0].ref, { isRead: !currentStatus });

            // 3. 🌟 カレンダー・サイドバー連動の要（キャッシュの狙い撃ち更新）
            const [y, m] = date.split(/[-/]/);
            const cacheKey = `cp_cal_cache_v_ultimate_${y}_${m.padStart(2, '0')}`;
            const cached = JSON.parse(sessionStorage.getItem(cacheKey) || '{}');
            
            if (cached.notifications) {
                const targetIdx = cached.notifications.findIndex(n => 
                    clean(n.visitorName) === clean(visitorName) && 
                    dateToNum(n.visitDate) === dateToNum(date) && 
                    clean(n.customerName) === clean(customerName)
                );
                if (targetIdx !== -1) {
                    // キャッシュ内の未読状態を直接書き換え
                    cached.notifications[targetIdx].isRead = !currentStatus;
                    sessionStorage.setItem(cacheKey, JSON.stringify(cached));
                }
            }

            // 4. 爆速リロードと位置保持
            if(autoOpenId) sessionStorage.setItem('cp_auto_open_id', autoOpenId);
            location.reload(); 
        }
    } catch (e) { console.error("Toggle Error:", e); }
};
        init();
    </script>
</body>
</html>
