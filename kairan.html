<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8"><title>回覧一覧 | CP My Page</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --copros-orange: #ff7e11; --copros-navy: #004098; }
        body { font-family: "Hiragino Kaku Gothic ProN", Meiryo, sans-serif; background-color: #f1f5f9; }
        .accordion-item { background: white; border-radius: 1.2rem; border: 1px solid #e2e8f0; overflow: hidden; margin-bottom: 1rem; transition: all 0.3s; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.02); }
        .accordion-item.unread { border-left: 6px solid var(--copros-orange); }
        .accordion-header { padding: 1.2rem 2rem; cursor: pointer; display: flex; align-items: center; justify-content: space-between; background: #3c4b5a; color: white; transition: background 0.2s; }
        .accordion-header:hover { background: #2d3748; }
        .accordion-content { display: none; padding: 2rem; background: white; border-top: 1px solid #f8fafc; }
        .status-txt { font-size: 10px; font-weight: 900; padding: 2px 10px; border-radius: 6px; min-width: 50px; text-align: center; text-transform: uppercase; }
        .status-unread { background: var(--copros-orange); color: white; }
        .status-read { background: #f1f5f9; color: #94a3b8; }
        .info-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1.5rem; margin-bottom: 1.5rem; border-bottom: 1px solid #f1f5f9; padding-bottom: 1.5rem; }
        .info-label { font-size: 10px; color: #94a3b8; font-weight: 800; text-transform: uppercase; margin-bottom: 4px; }
        .info-value { font-size: 14px; font-weight: 800; color: #475569; }
        .report-box { background: #f8fafc; border-radius: 1rem; padding: 1.5rem; border: 1px solid #f1f5f9; font-size: 13px; line-height: 1.7; color: #334155; }
        .badge { padding: 3px 10px; border-radius: 8px; font-size: 10px; font-weight: 900; color: white; }
        .badge-apo { background: #3b82f6; }
        .badge-rec { background: var(--copros-navy); }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
    </style>
</head>
<body class="flex h-screen overflow-hidden text-slate-700">
    <div id="sidebar-placeholder"></div>
    <main class="flex-1 flex flex-col overflow-hidden">
        <div id="header-placeholder"></div>
        <div class="flex-1 overflow-auto p-4 lg:p-8 custom-scrollbar">
            <div class="max-w-[1100px] mx-auto">
                
                <div class="flex justify-between items-end mb-10">
                    <div>
                        <h1 class="text-3xl lg:text-4xl font-black text-slate-800 tracking-tighter mb-1">回覧一覧</h1>
                        <nav class="text-[10px] font-black text-slate-400 uppercase tracking-widest italic">Review & Circular Management</nav>
                    </div>
                    <div class="flex gap-2 items-center bg-white p-1.5 rounded-2xl border border-slate-100 shadow-sm">
                        <button onclick="window.bulkAction('read')" class="px-5 py-2.5 text-slate-500 rounded-xl font-black text-[10px] hover:bg-slate-50 transition-all border border-transparent">一括既読</button>
                        <div class="w-px h-6 bg-slate-100"></div>
                        <button onclick="window.bulkAction('delete')" class="px-5 py-2.5 text-rose-500 rounded-xl font-black text-[10px] hover:bg-rose-50 transition-all">一括削除</button>
                    </div>
                </div>

                <div id="kairanList" class="space-y-3 mb-24">
                    <div class="py-20 text-center text-slate-300 font-bold italic animate-pulse">データを同期中...</div>
                </div>
            </div>
        </div>
    </main>

    <script type="module" src="common.js"></script>
    <script type="module">
        import { db, getDisplayDept } from "./common.js";
        import { collection, getDocs, getDoc, updateDoc, doc, writeBatch, query, where, orderBy, limit, arrayUnion, addDoc, serverTimestamp } 
        from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
       
        let myName = sessionStorage.getItem('userName');
       
        const clean = (s) => (s||"").toString().replace(/\s+/g, '');

        // ▼ カレンダーのキャッシュを消す共通関数（0埋め対応）
        const clearCalCache = (dateStr) => {
            if(!dateStr) { 
                Object.keys(sessionStorage).forEach(k => { if (k.startsWith('cp_cal_cache')) sessionStorage.removeItem(k); });
                return; 
            }
            const parts = dateStr.split(/[-/]/);
            const key = `cp_cal_cache_v_ultimate_${parts[0]}_${parts[1].padStart(2, '0')}`;
            sessionStorage.removeItem(key);
        };

        async function init() {
            const container = document.getElementById('kairanList');
            if(!myName) { container.innerHTML = '<p class="text-center py-20 text-rose-400 font-bold">ログイン情報がありません</p>'; return; }

            try {
                await loadStaffs();
        // 🌟 ご指定の部署リストをセット
        const depts = ["社長", "専務", "ケコム部", "関西支店", "関東支店", "中部営業所", "その他の部署"];
        const deptSelect = document.getElementById('staffDeptFilter');
        if (deptSelect) {
            deptSelect.innerHTML = '<option value="ALL">全部署</option>' + 
                depts.map(d => `<option value="${d}">${d}</option>`).join('');
        }                
                // 1.  読み込み件数の最適化50件
                const q = query(collection(db, "notifications"), where("recipient", "==", myName), limit(50));
                const snap = await getDocs(q);
                let notices = snap.docs.map(d => ({ id: d.id, ...d.data() }));
                notices.sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));

                const recordDataMap = {};
                if (notices.length > 0) {
                    // 🌟 爆速・省エネ：通知に含まれる顧客名だけを抽出して一括取得
                    const allCustNames = [...new Set(notices.filter(n => !n.type.includes("アポ")).map(n => n.customerName))];
                    
                    // 実績取得の効率化50件
                    for (let i = 0; i < allCustNames.length; i += 30) {
                        const chunk = allCustNames.slice(i, i + 30);
                        const qr = query(collection(db, "activity_records"), where("customerName", "in", chunk), limit(50));
                        const rSnap = await getDocs(qr);
                        
                        // 取得した実績を一時的にメモリへ格納
                        const tempMap = {};
                        rSnap.forEach(rd => {
                            const d = rd.data();
                            const key = `${clean(d.customerName)}_${clean(d.visitDate)}_${clean(d.visitorName)}`;
                            tempMap[key] = { recordId: rd.id, ...d };
                        });

                        notices.forEach(n => {
                            const nKey = `${clean(n.customerName)}_${clean(n.visitDate)}_${clean(n.visitorName)}`;
                            if (tempMap[nKey]) {
                                recordDataMap[n.id] = tempMap[nKey];
                            }
                        });
                    }
                }
                // 🌟 自動掃除機（削除）を撤廃し、表示側で「最新の1件」に名寄せする
            const uniqueMap = new Map();
            notices.forEach(n => {
                const uKey = `${clean(n.recipient)}_${clean(n.visitorName)}_${clean(n.customerName)}_${(n.visitDate||"").replace(/[-/]/g,'/')}`;
                if (!uniqueMap.has(uKey)) uniqueMap.set(uKey, n);
            });

            // 🌟 修正：紐付けに失敗していても、通知が存在するなら必ず表示させる（カードが出ない問題を解決）
            const finalNotices = Array.from(uniqueMap.values());
            
            // 全ての通知を表示対象にする（実績がない場合は空のオブジェクトを表示に使う）
            renderList(finalNotices, recordDataMap);
                
 const lastOpenedId = sessionStorage.getItem('cp_last_opened_kairan');
    if (lastOpenedId) {
        setTimeout(() => {
            const item = document.getElementById(`item-${lastOpenedId}`);
            if (item) {
                const content = item.querySelector('.accordion-content');
                if (content) {
                    content.style.display = 'block';
                    item.querySelector('.fa-chevron-down').style.transform = 'rotate(180deg)';
                    item.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
            }
            sessionStorage.removeItem('cp_last_opened_kairan');
        }, 300);
    }
 } catch (e) { 
                console.error("回覧取得エラー:", e); 
                container.innerHTML = '<p class="text-center py-20 text-rose-400 font-bold uppercase text-xs font-black">データの同期に失敗しました</p>';
            }
        }
        
        function renderList(notices, recordDataMap) {
            const container = document.getElementById('kairanList');
            container.innerHTML = notices.length ? notices.map((n, idx) => {
                const r = recordDataMap[n.id] || {}; 
                const displayDate = n.visitDate || n.appointDate || "";
                const dateFmt = displayDate ? String(displayDate).replace(/-/g,'/') : '日付不明';
                const images = (r.attachments || []).map(f => f.base64 || f.url);
                // 🌟 親切設計：訪問内容を短いアイコンラベルに変換
                const typeLabels = {
                    '営業': '営', 'リモート営業': 'リモ', '打合せ(受注後)': '打',
                    '施工': '施', '定期訪問': '定', '電話応対': '電',
                    '来訪対応': '来', '業務日報': '日', 'メディア収集': 'メ',
                    '差別化プレゼンチラシ': '差'
                };
                const shortType = typeLabels[r.activityType] || '営';

                return `
                <div class="accordion-item ${n.isRead ? '' : 'unread'}" id="item-${n.id}">
                    <div class="accordion-header" onclick="window.toggleKairan('${n.id}', ${n.isRead}, '${displayDate}')">
                        <div class="flex items-center gap-4">
                            <input type="checkbox" class="bulk-check w-5 h-5 accent-[#004098] rounded-md" onclick="event.stopPropagation()" value="${n.id}">
                            <span class="status-txt ${n.isRead ? 'status-read' : 'status-unread' + (n.isRead ? '' : ' animate-pulse')}">${n.isRead ? '既読' : '未読'}</span>
                            <span class="badge ${n.type.includes('アポ') ? 'badge-apo' : 'badge-rec'}">${n.type.includes('アポ') ? 'アポ' : '実績'}</span>
                            <span class="text-sm font-mono font-black text-white/90">${dateFmt}</span>
                            <span class="text-sm font-black text-white tracking-tight">
                              <span class="text-[10px] text-[#87ceeb] mr-1">[${shortType}]</span>
                              ${n.visitorName} ➔ ${n.customerName}
                             </span>
                        </div>
                        <i class="fa-solid fa-chevron-down opacity-50 text-xs transition-transform text-white"></i>
                    </div>
                    
                <div class="accordion-content">
                    <div class="flex justify-end mb-6">
                        <button onclick="window.toggleReadStatus('${n.id}', ${n.isRead === true})" 
                            class="px-5 py-2 rounded-full font-black text-[10px] transition-all border flex items-center gap-2 
                            ${n.isRead ? 'bg-orange-50 text-orange-600 border-orange-200 hover:bg-orange-600 hover:text-white shadow-sm' 
                                       : 'bg-slate-50 text-slate-300 border-slate-100 cursor-not-allowed'}">
                            <i class="fa-solid fa-envelope${n.isRead ? '' : '-open'}"></i>
                            <span>${n.isRead ? '未読に戻す' : '未読'}</span>
                        </button>
                    </div>       

                    <div class="info-grid">
                        <div><p class="info-label">訪問内容</p><p class="info-value text-[#ff7e11] font-black">${r.activityType || '営業'}</p></div>
                        <div><p class="info-label">お客様担当者</p><p class="info-value">${r.customerStaffName || '--'}</p></div>
                        <div><p class="info-label">訪問時間</p><p class="info-value text-blue-600">${r.startTime || '--:--'} 〜 ${r.endTime || '--:--'}</p></div>
                        <div>
                            <p class="info-label">顧客ランク / 属性</p>
                            <p class="info-value"><span class="bg-slate-700 text-white px-2 py-0.5 rounded text-[9px] mr-1">${r.customerRank || '--'}</span><span class="text-orange-600">${r.customerAttr || '--'}</span></p>
                        </div>
                        <div><p class="info-label">同行者</p><p class="info-value">${r.companion || 'なし'}</p></div>
                        <div><p class="info-label">訪問者の部署</p><p class="info-value">${getDisplayDept(r.visitorDept)}</p></div>
                    </div>

                    <div class="mb-6">
                        <p class="info-label mb-2 text-[10px] font-black opacity-40 uppercase tracking-widest">定性データ分析</p>
                        <div class="flex flex-wrap gap-2">
                            ${r.qualData1 ? `<span class="bg-blue-50 text-blue-600 px-2 py-1 rounded text-[10px] font-black border border-blue-100">${r.qualData1}</span>` : ''}
                            ${r.qualData2 ? `<span class="bg-orange-50 text-orange-600 px-2 py-1 rounded text-[10px] font-black border border-orange-100">${r.qualData2}</span>` : ''}
                            ${r.qualData3 ? `<span class="bg-emerald-50 text-emerald-600 px-2 py-1 rounded text-[10px] font-black border border-emerald-100">${r.qualData3}</span>` : ''}
                            ${r.qualFree ? `<span class="bg-slate-100 text-slate-600 px-2 py-1 rounded text-[10px] font-black border border-slate-200">${r.qualFree}</span>` : ''}
                        </div>
                    </div>

                    <p class="info-label mb-2 tracking-widest uppercase">■ お客様からの情報 / 自分・スタッフの考え</p>
                    <div class="report-box mb-4 whitespace-pre-wrap">${r.content || '報告なし'}</div>
                    <div class="report-box border-l-4 border-orange-200 bg-orange-50/30 text-slate-600 mb-6 whitespace-pre-wrap">${r.staffThoughts || '未入力'}</div>
                    ${images.length ? `<div class="flex flex-wrap gap-2 mb-6">${images.map(src => `<img src="${src}" class="w-20 h-20 object-cover rounded-xl border">`).join('')}</div>` : ''}

                    <div class="mt-4 flex justify-end mb-6">
                        <div class="bg-[#004098] text-white px-5 py-2 rounded-xl text-[10px] font-black shadow-md">
                            <i class="fa-regular fa-calendar-check mr-2"></i>次回訪問予定日：${r.nextVisitDate || '--/--/--'}
                        </div>
                    </div>

                                               <!-- 🌟 修正：全データでコメント可能にする新デザインのコメント欄 -->
                        <div class="mt-8 p-6 bg-blue-50/50 rounded-2xl border border-blue-100 shadow-inner">
                            <p class="text-[9px] font-black text-blue-400 uppercase tracking-widest mb-4 flex items-center gap-2">
                                <i class="fa-solid fa-comment-dots text-sm"></i> 指導・確認コメント
                            </p>
                            <div class="space-y-3 mb-5">
                                ${(r.comments || []).map((c, idx) => `
                                    <div class="p-3 bg-white rounded-xl shadow-sm border border-blue-50 text-left relative">
                                        <div class="flex justify-between items-center mb-1">
                                            <div class="flex items-center gap-2">
                                                <!-- 🌟 日付を左端に配置 -->
                                                <span class="text-[9px] font-bold text-slate-400 font-mono">${c.date}</span>
                                                <span class="text-[10px] font-black px-2 py-0.5 bg-blue-50 text-blue-600 rounded-full">${c.sender} ➔ ${c.receiver}</span>
                                            </div>
                                            <!-- 🌟 ✕ボタンを追加 -->
                                            ${c.sender === myName ? `
                                                <button onclick="window.deleteComment('${r.recordId || n.id}', ${idx}, '${n.id}')" 
                                                    class="text-rose-400 hover:text-rose-600 font-black text-sm p-1">
                                                    ✕
                                                </button>` : ''}
                                        </div>
                                        <p class="text-xs font-bold text-slate-700 leading-relaxed">${c.text}</p>
                                    </div>
                                `).join('')}
                            </div>
                            <div class="space-y-3 text-left">
                                <textarea id="cmt-text-${idx}" class="w-full p-3 text-xs font-bold rounded-xl border border-slate-200 outline-none focus:ring-2 focus:ring-blue-400 min-h-[80px]" placeholder="コメントを入力..."></textarea>
                                <div class="flex justify-between items-center gap-4">
                                    <div class="flex items-center gap-2 flex-1">
                                        <span class="text-[9px] font-black text-slate-400">宛先:</span>
<div id="cmt-to-display-${idx}" 
     class="flex-1 p-2 bg-white border border-slate-200 rounded-lg text-[10px] font-black min-h-[34px] cursor-pointer hover:bg-slate-50 transition-all flex items-center" 
     onclick="window.openStaffModal(${idx}, '${n.visitorName}')">
    ${n.visitorName}
</div>
                                    </div>
                                    <button onclick="window.postComment('${r.recordId || n.id}', '${n.customerName}', ${idx}, '${n.id}', '${displayDate}')" class="px-8 py-2.5 bg-[#004098] text-white rounded-xl text-[10px] font-black shadow-lg active:scale-95 transition-all">
                                        送信
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>`;
}).join('') : `
    <div class="py-20 text-center border-2 border-dashed border-slate-200 rounded-[2rem] bg-white/50">
        <i class="fa-solid fa-check-circle text-slate-200 text-4xl mb-4 block"></i>
        <p class="text-slate-400 font-black text-sm uppercase tracking-widest">現在、確認が必要な回覧はありません</p>
        <p class="text-slate-300 text-[10px] mt-2 font-bold">全ての通知を確認済みです。お疲れ様でした！</p>
    </div>`;
        }

        // ▼ アコーディオン開く時に既読処理
        window.toggleKairan = async (id, isRead, date) => {
            const item = document.getElementById(`item-${id}`);
            const content = item.querySelector('.accordion-content');
            const isOpen = content.style.display === 'block';
            content.style.display = isOpen ? 'none' : 'block';
            
            if (!isOpen && !isRead) {
                try {
                    await updateDoc(doc(db, "notifications", id), { isRead: true });
                    item.classList.remove('unread');
                    const label = item.querySelector('.status-txt');
                    label.innerText = "既読"; 
                    label.className = "status-txt status-read";
                    // ▼ カレンダーキャッシュをクリア
                    clearCalCache(date);
                } catch (e) { console.error(e); }
            }
        };

        // ▼ 一括処理
        window.bulkAction = async (action) => {
            const checks = document.querySelectorAll('.bulk-check:checked');
            if (!checks.length) return alert("項目にチェックを入れてください");
            if (!confirm(`${checks.length}件を${action === 'read' ? '既読' : '削除'}にしますか？`)) return;
            
            const batch = writeBatch(db);
            checks.forEach(cb => {
                const ref = doc(db, "notifications", cb.value);
                if (action === 'read') batch.update(ref, { isRead: true });
                else batch.delete(ref);
            });
            await batch.commit();
            
            // ▼ 一括処理後、カレンダーキャッシュを全クリア
            Object.keys(sessionStorage).forEach(k => {
                if (k.startsWith('cp_cal_cache')) sessionStorage.removeItem(k);
            });
            
            location.reload();
        };

        // ▼ 個人履歴へ遷移（省エネ＋既読同期）
        window.goUsage = (name, date, customer) => {
            let m = new Date().getMonth() + 1;
            if (date) {
                const parts = date.split(/[-/]/);
                if (parts.length >= 2) m = parseInt(parts[1]);
            }
            sessionStorage.setItem('cp_usage_jump_name', name);
            sessionStorage.setItem('cp_usage_jump_month', m);
            sessionStorage.setItem('cp_usage_jump_customer', customer);
            sessionStorage.setItem('cp_usage_jump_date', date);
            
            // ▼ 戻ってくるまでのフラグをセット
            sessionStorage.setItem('cp_return_from_kairan', 'true');
            
            location.href = 'usage.html';
        };

window.postComment = async (recordId, customerName, index, noticeId, visitDate) => {
    const text = document.getElementById(`cmt-text-${index}`).value.trim();
    const receiverRaw = document.getElementById(`cmt-to-display-${index}`).innerText;
    const sender = myName || "管理者";
    
    if (!text || receiverRaw === '選択してください') return alert("内容を入力してください");

    try {
        const now = new Date();
        const dateStr = `${now.getMonth()+1}/${now.getDate()} ${now.getHours()}:${String(now.getMinutes()).padStart(2,'0')}`;
        
        // 1. コメント本体の書き込み（実績 or 通知）
        const collectionName = (recordId === noticeId) ? "notifications" : "activity_records"; 
        await updateDoc(doc(db, collectionName, recordId), { 
            comments: arrayUnion({ sender, receiver: receiverRaw, text, date: dateStr }) 
        });

        // 2. 宛先の整理（自分を除外し、一人ずつ処理）
        const targetRecipients = receiverRaw.split(', ').map(n => n.trim()).filter(name => name !== sender);

        // 3. 通知の重複防止（一人一通に集約）
        for (const recipient of targetRecipients) {
            const qNoti = query(collection(db, "notifications"), 
                where("recipient", "==", recipient),
                where("customerName", "==", customerName),
                where("visitDate", "==", visitDate)
            );
            const nSnap = await getDocs(qNoti);

            if (!nSnap.empty) {
                // 🌟 予知対策：既存のカードがあれば「未読」に戻して時間を更新するだけ（増えない！）
                await updateDoc(nSnap.docs[0].ref, { 
                    isRead: false, 
                    visitorName: sender, // 最後にコメントした人を表示
                    createdAt: serverTimestamp() 
                });
            } else {
                // 新規作成
                await addDoc(collection(db, "notifications"), {
                    recipient: recipient,
                    visitorName: sender,
                    customerName: customerName,
                    visitDate: visitDate, 
                    type: "コメント入電",
                    isRead: false,
                    createdAt: serverTimestamp()
                });
            }
        }
        
        // 4. カレンダーキャッシュの削除
        clearCalCache(visitDate);
        
        alert("コメントを送信しました");
        sessionStorage.setItem('cp_last_opened_kairan', noticeId);
        location.reload(); 
    } catch (e) { 
        console.error(e);
        alert("送信エラー: " + e.message); 
    }
};

window.deleteComment = async (recordId, commentIdx, noticeId) => {
    if (!confirm("自分のコメントを取り消しますか？")) return;
    try {
        const collectionName = (recordId === noticeId) ? "notifications" : "activity_records"; 
        const ref = doc(db, collectionName, recordId);
        const docSnap = await getDoc(ref);
        
        if (docSnap.exists()) {
            const data = docSnap.data();
            let comments = data.comments || [];
            comments.splice(parseInt(commentIdx), 1); 
            
            await updateDoc(ref, { comments: comments });

            // 🌟 追加（予知対策）：キャッシュを削除してリロード後に最新状態を表示させる
            const visitDate = data.visitDate || data.appointDate;
            if (visitDate) clearCalCache(visitDate);
            
            sessionStorage.setItem('cp_last_opened_kairan', noticeId);
            alert("コメントを削除しました");
            location.reload();
        } else {
            alert("データが見つかりませんでした。既に削除されている可能性があります。");
        }
    } catch (e) { 
        console.error("削除エラー:", e);
        alert("削除に失敗しました: " + e.message); 
    }
};

window.toggleReadStatus = async (id, currentStatus) => {
    // 🌟 修正：確認ダイアログを追加
    if (!confirm(currentStatus ? "未読に戻しますか？" : "既読にしますか？")) return;
    
    try {
        await updateDoc(doc(db, "notifications", id), { isRead: !currentStatus });
        Object.keys(sessionStorage).forEach(k => { if (k.startsWith('cp_cal_cache')) sessionStorage.removeItem(k); });
        
        // 🌟 修正：リロード後に自動で開くためのIDを保存
        sessionStorage.setItem('cp_last_opened_kairan', id);
        location.reload();
    } catch (e) { console.error(e); }
};
        let allStaffs = [], modalSelected = [], currentActiveIdx = null;

        // 社員名簿の読み込み
        async function loadStaffs() {
            const KEY = 'cp_staffs_cache';
            const cached = sessionStorage.getItem(KEY);
            if (cached) { allStaffs = JSON.parse(cached); return; }
            const snap = await getDocs(query(collection(db, "staffs"), orderBy("name")));
            allStaffs = snap.docs.map(d => d.data());
            sessionStorage.setItem(KEY, JSON.stringify(allStaffs));
        }

        window.openStaffModal = (idx, defaultName) => {
            currentActiveIdx = idx;
            document.getElementById('staffModal').style.display = 'flex';
            const curVal = document.getElementById(`cmt-to-display-${idx}`).innerText;
            modalSelected = (curVal && curVal !== '選択してください') ? curVal.split(', ') : (defaultName ? [defaultName] : []);
            window.renderStaffList();
        };
        window.closeModal = () => document.getElementById('staffModal').style.display = 'none';
        window.renderStaffList = () => {
            const kw = document.getElementById('staffKeyword').value.toLowerCase();
            const dp = document.getElementById('staffDeptFilter').value;
            
            // 🌟 判定用の部署リスト
            const mainDepts = ["社長", "専務", "ケコム部", "関西支店", "関東支店", "中部営業所"];

            const filtered = allStaffs.filter(s => {
                const matchKw = !kw || s.name.includes(kw);
                let matchDept = false;

                if (dp === 'ALL') {
                    matchDept = true;
                } else if (dp === 'その他の部署') {
                    // 🌟 リスト（mainDepts）に含まれていない部署の人を全員出す
                    matchDept = !mainDepts.includes(s.dept);
                } else {
                    matchDept = s.dept === dp;
                }
                return matchKw && matchDept;
            });

            document.getElementById('staffList').innerHTML = filtered.map(s =>
                `<div class="staff-item p-3 border-b flex justify-between cursor-pointer ${modalSelected.includes(s.name) ? 'bg-blue-50 text-blue-700 font-bold' : ''}" onclick="window.toggleStaffSelection('${s.name}')">
                    <span>${s.name}</span><span class="text-[9px] opacity-40">${s.dept || ''}</span>
                </div>`).join('');
        };
        window.toggleStaffSelection = (name) => {
            if (modalSelected.includes(name)) modalSelected = modalSelected.filter(n => n !== name);
            else modalSelected.push(name);
            window.renderStaffList();
        };
        window.clearModalSelection = () => { modalSelected = []; window.renderStaffList(); };
        window.applySelection = () => {
            document.getElementById(`cmt-to-display-${currentActiveIdx}`).innerText = modalSelected.join(', ') || '選択してください';
            window.closeModal();
        };        
          init(); 
    </script>
    <!-- スタッフモーダル -->
    <div id="staffModal" class="modal-overlay" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 100; backdrop-filter: blur(8px); align-items: center; justify-content: center; padding: 1rem;">
        <div class="modal-content" style="background: white; width: 100%; max-width: 450px; border-radius: 1.5rem; overflow: hidden;">
            <div class="bg-slate-900 p-4 text-white flex justify-between items-center">
                <span class="font-black text-xs uppercase tracking-widest">宛先を選択</span>
                <i class="fa-solid fa-xmark cursor-pointer" onclick="window.closeModal()"></i>
            </div>
            <div class="p-4 bg-slate-50 border-b border-slate-100">
                <div class="grid grid-cols-2 gap-2 mb-2">
                    <input type="text" id="staffKeyword" oninput="window.renderStaffList()" placeholder="氏名検索..." class="p-2.5 rounded-lg border border-slate-200 text-xs font-bold outline-none">
                    <select id="staffDeptFilter" onchange="window.renderStaffList()" class="p-2.5 rounded-lg border border-slate-200 text-xs font-bold outline-none"><option value="ALL">全部署</option></select>
                </div>
            </div>
            <div id="staffList" class="overflow-y-auto custom-scrollbar" style="height: 350px;"></div>
            <div class="p-4 bg-slate-50 grid grid-cols-3 gap-2 border-t border-slate-100">
                <button onclick="window.applySelection()" class="col-span-2 py-3 bg-[#004098] text-white rounded-xl font-black text-sm shadow-lg active:scale-95">決定</button>
                <button onclick="window.clearModalSelection()" class="py-3 bg-white border border-slate-200 text-slate-400 rounded-xl font-bold text-sm hover:bg-slate-100 transition-all">クリア</button>
            </div>
        </div>
    </div>
